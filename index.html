            items.push({ kind: 'game', id: 'game_' + g.id, name: g.name, icon: g.icon, run: () => g.launch && g.launch() });
        }
        items.push({ kind: 'special', id: 'special_taskview',  name: 'Task View',          icon: '🗂️', run: () => openTaskView() });
        items.push({ kind: 'special', id: 'special_search',    name: 'Search',             icon: '🔍', run: () => openSearchPalette() });
        items.push({ kind: 'special', id: 'special_lock',      name: 'Lock screen',        icon: '🔒', run: () => showLockScreen() });
        items.push({ kind: 'special', id: 'special_settings',  name: 'Settings',           icon: '⚙️', run: () => { try { openSettings(); } catch(e){} } });
        items.push({ kind: 'special', id: 'special_newdesk',   name: 'New virtual desktop',icon: '➕', run: () => addWorkspace() });
        items.push({ kind: 'special', id: 'special_shutdown',  name: 'Shutdown',           icon: '⏻', run: () => shutdown() });
        items.push({ kind: 'special', id: 'special_restart',   name: 'Restart',            icon: '🔄', run: () => restart() });
        for (const f of customFolders) items.push({ kind: 'folder', id: 'folder_' + f.id, name: f.name, icon: '📁', run: () => openFolder(f.id) });
        for (const df of desktopFiles) items.push({ kind: 'file', id: 'file_' + df.id, name: df.name, icon: '📄', run: () => openFile(df.id) });
        return items;
    }
    function findAppById(catalogId) {
        return getAppCatalog().find(it => it.id === catalogId);
    }
    function iconHtmlFor(it, size) {
        size = size || 22;
        if (typeof it.icon === 'string' && it.icon.startsWith('http')) {
            return `<img src="${it.icon}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;">`;
        }
        return `<span class="sr-emoji" style="font-size:${size-2}px;">${it.icon || '📄'}</span>`;
    }

    // ---------- 1) PINNED TASKBAR APPS + reorder ----------
    if (!Array.isArray(window.__pinnedApps)) window.__pinnedApps = [];
    const pinnedDiv = document.getElementById('taskbarPinned');

    function renderPinned() {
        pinnedDiv.innerHTML = '';
        window.__pinnedApps.forEach((catalogId, idx) => {
            const it = findAppById(catalogId);
            if (!it) return;
            const el = document.createElement('div');
            el.className = 'pinned-app';
            el.draggable = true;
            el.dataset.idx = idx;
            el.dataset.id = catalogId;
            el.title = it.name;
            el.innerHTML = (typeof it.icon === 'string' && it.icon.startsWith('http'))
                ? `<img src="${it.icon}" alt="">`
                : `<span class="pinned-emoji">${it.icon}</span>`;
            el.addEventListener('click', () => { it.run(); });
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (confirm(`Unpin "${it.name}" from the taskbar?`)) {
                    window.__pinnedApps.splice(idx, 1);
                    renderPinned(); saveState();
                }
            });
            // Reorder via native HTML5 DnD
            el.addEventListener('dragstart', (e) => {
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('application/x-pin-reorder', String(idx));
            });
            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                pinnedDiv.querySelectorAll('.pinned-app').forEach(p => p.classList.remove('drop-before','drop-after'));
            });
            el.addEventListener('dragover', (e) => {
                if (!e.dataTransfer.types.includes('application/x-pin-reorder')) return;
                e.preventDefault();
                const rect = el.getBoundingClientRect();
                const before = (e.clientX - rect.left) < rect.width / 2;
                pinnedDiv.querySelectorAll('.pinned-app').forEach(p => p.classList.remove('drop-before','drop-after'));
                el.classList.add(before ? 'drop-before' : 'drop-after');
            });
            el.addEventListener('drop', (e) => {
                const fromIdx = parseInt(e.dataTransfer.getData('application/x-pin-reorder'), 10);
                if (isNaN(fromIdx)) return;
                e.preventDefault();
                const rect = el.getBoundingClientRect();
                const before = (e.clientX - rect.left) < rect.width / 2;
                let toIdx = parseInt(el.dataset.idx, 10);
                const moved = window.__pinnedApps.splice(fromIdx, 1)[0];
                if (fromIdx < toIdx) toIdx -= 1;
                if (!before) toIdx += 1;
                window.__pinnedApps.splice(toIdx, 0, moved);
                renderPinned(); saveState();
            });
            pinnedDiv.appendChild(el);
        });
    }

    function pinAppToTaskbar(catalogId) {
        if (!catalogId) return;
        if (window.__pinnedApps.includes(catalogId)) return;
        window.__pinnedApps.push(catalogId);
        renderPinned(); saveState();
        // Visual hint
        const last = pinnedDiv.lastElementChild;
        if (last) last.animate([{transform:'scale(0.4)',opacity:0},{transform:'scale(1.15)',opacity:1},{transform:'scale(1)'}], {duration:280, easing:'cubic-bezier(.2,.8,.2,1)'});
    }

    // Allow dropping desktop icons (from custom drag system) onto the taskbar to pin them
    const __taskbarEl = document.getElementById('taskbar');
    function tryPinFromDrag(e) {
        if (!dragTarget) return false;
        const taskbarRect = __taskbarEl.getBoundingClientRect();
        if (e.clientY < taskbarRect.top) return false;
        const type = dragTarget.getAttribute('data-type');
        const id = dragTarget.getAttribute('data-id');
        let catalogId = null;
        if (type === 'app') catalogId = id;
        else if (type === 'game') catalogId = 'game_' + id;
        else if (type === 'folder') catalogId = 'folder_' + id;
        else if (type === 'file') catalogId = 'file_' + id;
        if (!catalogId) return false;
        pinAppToTaskbar(catalogId);
        return true;
    }
    // Highlight taskbar while dragging an icon over it
    document.addEventListener('mousemove', (e) => {
        if (!dragTarget) return;
        const r = __taskbarEl.getBoundingClientRect();
        if (e.clientY >= r.top) __taskbarEl.classList.add('pin-drop-target');
        else __taskbarEl.classList.remove('pin-drop-target');
    });
    // Hook into stopDrag: wrap the existing function
    const __origStopDrag = stopDrag;
    stopDrag = function(e) {
        const wasDragging = !!dragTarget;
        const target = dragTarget;
        // If released over the taskbar, pin instead of moving
        if (wasDragging && e.clientY >= __taskbarEl.getBoundingClientRect().top) {
            const pinned = tryPinFromDrag(e);
            __taskbarEl.classList.remove('pin-drop-target');
            if (pinned) {
                target.classList.remove('dragging');
                // Don't persist the new (off-screen) position — re-render
                renderDesktopIcons();
                dragTarget = null;
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', stopDrag);
                return;
            }
        }
        __taskbarEl.classList.remove('pin-drop-target');
        return __origStopDrag(e);
    };

    // ---------- 3) VIRTUAL DESKTOPS / WORKSPACES ----------
    // A workspace owns a set of window IDs (from openWindows Map).
    if (!Array.isArray(window.__workspaces) || window.__workspaces.length === 0) {
        if (window.__savedWorkspaces && window.__savedWorkspaces.length) {
            window.__workspaces = window.__savedWorkspaces.map(w => ({ id: w.id, name: w.name, windowIds: new Set() }));
        } else {
            window.__workspaces = [{ id: 1, name: 'Desktop 1', windowIds: new Set() }];
        }
    }
    window.__activeWorkspace = Math.min(window.__savedActiveWorkspace || 0, window.__workspaces.length - 1);

    function activeWs() { return window.__workspaces[window.__activeWorkspace]; }

    // Wrap registerWindow so each new window joins the active workspace
    const __origRegisterWindow = registerWindow;
    registerWindow = function(appId, win, title, icon) {
        const id = __origRegisterWindow(appId, win, title, icon);
        activeWs().windowIds.add(id);
        win.dataset.workspace = String(window.__activeWorkspace);
        // Re-filter taskbar after register so windows in other desks stay hidden
        applyWorkspaceVisibility();
        updateTaskbarButtons();
        return id;
    };

    // Wrap updateTaskbarButtons to only show buttons for current workspace
    const __origUpdateTaskbar = updateTaskbarButtons;
    updateTaskbarButtons = function() {
        // Save full map, temporarily filter, render, restore
        const full = openWindows;
        const filtered = new Map();
        const ws = activeWs();
        for (const [winId, info] of full.entries()) {
            if (ws.windowIds.has(winId)) filtered.set(winId, info);
        }
        // Swap by reassigning entries (the original closure references `openWindows`)
        // so instead we render manually mimicking the original.
        taskbarItemsDiv.innerHTML = '';
        for (const [winId, info] of filtered.entries()) {
            const btn = document.createElement('div');
            btn.className = 'taskbar-app-btn';
            btn.setAttribute('data-winid', winId);
            btn.innerHTML = `${info.icon} ${info.title}`;
            if (info.windowElement.style.display !== 'none') btn.classList.add('active');
            btn.onclick = () => {
                const w = info.windowElement;
                if (w.style.display === 'none') {
                    setMinimizeVars(w, btn.getBoundingClientRect());
                    w.style.display = 'flex';
                    if (animations) {
                        w.classList.remove('minimizing');
                        w.classList.add('restoring');
                        w.addEventListener('animationend', function h(){ w.classList.remove('restoring'); w.removeEventListener('animationend', h); });
                    }
                    w.style.zIndex = Date.now();
                    btn.classList.add('active');
                } else {
                    minimizeWindow(w, winId);
                }
            };
            taskbarItemsDiv.appendChild(btn);
        }
    };

    function applyWorkspaceVisibility() {
        const ws = activeWs();
        for (const [winId, info] of openWindows.entries()) {
            if (ws.windowIds.has(winId)) {
                if (info.windowElement.dataset.userMinimized !== '1') {
                    info.windowElement.style.display = 'flex';
                }
            } else {
                info.windowElement.style.display = 'none';
            }
        }
    }

    function switchWorkspace(idx) {
        if (idx < 0 || idx >= window.__workspaces.length) return;
        if (idx === window.__activeWorkspace) return;
        // Fade desktop briefly for feedback
        const d = document.getElementById('desktop');
        d.style.transition = 'opacity 0.16s ease';
        d.style.opacity = '0.4';
        setTimeout(() => {
            window.__activeWorkspace = idx;
            applyWorkspaceVisibility();
            updateTaskbarButtons();
            d.style.opacity = '1';
            setTimeout(() => d.style.transition = '', 200);
            saveState();
            renderTaskviewDesks();
        }, 130);
    }

    function addWorkspace() {
        const id = Date.now();
        window.__workspaces.push({ id, name: 'Desktop ' + (window.__workspaces.length + 1), windowIds: new Set() });
        renderTaskviewDesks();
        saveState();
    }
    function removeWorkspace(idx) {
        if (window.__workspaces.length <= 1) return;
        // Move that workspace's windows to the previous one
        const removed = window.__workspaces.splice(idx, 1)[0];
        const targetIdx = Math.max(0, idx - 1);
        const target = window.__workspaces[targetIdx];
        for (const winId of removed.windowIds) {
            target.windowIds.add(winId);
            const info = openWindows.get(winId);
            if (info) info.windowElement.dataset.workspace = String(targetIdx);
        }
        if (window.__activeWorkspace >= window.__workspaces.length) window.__activeWorkspace = window.__workspaces.length - 1;
        if (window.__activeWorkspace === idx) window.__activeWorkspace = targetIdx;
        applyWorkspaceVisibility();
        updateTaskbarButtons();
        renderTaskviewDesks();
        saveState();
    }

    // Task View overlay
    const taskviewOverlay = document.getElementById('taskviewOverlay');
    const taskviewWindowsDiv = document.getElementById('taskviewWindows');
    const taskviewDesksDiv = document.getElementById('taskviewDesks');

    function openTaskView() {
        renderTaskviewDesks();
        renderTaskviewWindows();
        taskviewOverlay.classList.add('show');
    }
    function closeTaskView() { taskviewOverlay.classList.remove('show'); }

    function renderTaskviewDesks() {
        taskviewDesksDiv.innerHTML = '';
        window.__workspaces.forEach((ws, i) => {
            const el = document.createElement('div');
            el.className = 'taskview-desk' + (i === window.__activeWorkspace ? ' active' : '');
            el.innerHTML = `<div class="desk-name">${escapeHtml(ws.name)}</div>
                            <div class="desk-count">${ws.windowIds.size} window${ws.windowIds.size === 1 ? '' : 's'}</div>
                            ${window.__workspaces.length > 1 ? '<button class="desk-close" title="Close desktop">×</button>' : ''}`;
            el.addEventListener('click', () => { switchWorkspace(i); renderTaskviewWindows(); renderTaskviewDesks(); });
            const closeBtn = el.querySelector('.desk-close');
            if (closeBtn) closeBtn.addEventListener('click', (ev) => { ev.stopPropagation(); removeWorkspace(i); renderTaskviewWindows(); });
            taskviewDesksDiv.appendChild(el);
        });
        const add = document.createElement('div');
        add.className = 'taskview-add-desk';
        add.textContent = '+';
        add.title = 'New desktop';
        add.addEventListener('click', () => { addWorkspace(); });
        taskviewDesksDiv.appendChild(add);
    }
    function renderTaskviewWindows() {
        taskviewWindowsDiv.innerHTML = '';
        const ws = activeWs();
        if (ws.windowIds.size === 0) {
            taskviewWindowsDiv.innerHTML = '<div style="color:#bbb; padding:30px; text-align:center; grid-column:1/-1;">No windows on this desktop. Open an app or switch desktops below.</div>';
            return;
        }
        for (const winId of ws.windowIds) {
            const info = openWindows.get(winId);
            if (!info) continue;
            const card = document.createElement('div');
            card.className = 'taskview-window-card';
            card.innerHTML = `<div class="twc-title">${info.icon} ${escapeHtml(info.title)}</div>
                              <div class="twc-empty">Click to focus</div>`;
            card.addEventListener('click', () => {
                closeTaskView();
                const w = info.windowElement;
                w.dataset.userMinimized = '0';
                w.style.display = 'flex';
                w.style.zIndex = Date.now();
            });
            taskviewWindowsDiv.appendChild(card);
        }
    }
    document.getElementById('taskviewBtn').addEventListener('click', openTaskView);
    taskviewOverlay.addEventListener('click', (e) => { if (e.target === taskviewOverlay) closeTaskView(); });

    // ---------- 2) SNAP LAYOUTS popup on maximize hover ----------
    let snapLayoutsEl = null, snapLayoutsTimer = null;

    function showSnapLayouts(targetWindow, anchorRect) {
        hideSnapLayouts();
        snapLayoutsEl = document.createElement('div');
        snapLayoutsEl.className = 'snap-layouts';
        snapLayoutsEl.innerHTML = `
            <div class="snap-layout-card layout-2col" data-layout="2col">
                <div class="zone" data-zone="left"></div><div class="zone" data-zone="right"></div>
            </div>
            <div class="snap-layout-card layout-2col-wide" data-layout="2col-wide">
                <div class="zone" data-zone="left2"></div><div class="zone" data-zone="right2"></div>
            </div>
            <div class="snap-layout-card layout-3col" data-layout="3col">
                <div class="zone" data-zone="l3"></div><div class="zone" data-zone="m3"></div><div class="zone" data-zone="r3"></div>
            </div>
            <div class="snap-layout-card layout-2x2" data-layout="2x2">
                <div class="zone" data-zone="tl"></div><div class="zone" data-zone="tr"></div>
                <div class="zone" data-zone="bl"></div><div class="zone" data-zone="br"></div>
            </div>`;
        document.body.appendChild(snapLayoutsEl);
        // Position below the maximize button
        const r = snapLayoutsEl.getBoundingClientRect();
        const left = Math.min(window.innerWidth - r.width - 8, Math.max(8, anchorRect.left - r.width / 2 + anchorRect.width / 2));
        const top = anchorRect.bottom + 6;
        snapLayoutsEl.style.left = left + 'px';
        snapLayoutsEl.style.top = top + 'px';
        // Wire zone clicks
        snapLayoutsEl.querySelectorAll('.zone').forEach(z => {
            z.addEventListener('click', (e) => {
                e.stopPropagation();
                const zone = z.getAttribute('data-zone');
                applySnapZone(targetWindow, zone);
                hideSnapLayouts();
            });
        });
        snapLayoutsEl.addEventListener('mouseleave', () => { snapLayoutsTimer = setTimeout(hideSnapLayouts, 250); });
        snapLayoutsEl.addEventListener('mouseenter', () => { if (snapLayoutsTimer) { clearTimeout(snapLayoutsTimer); snapLayoutsTimer = null; } });
    }
    function hideSnapLayouts() {
        if (snapLayoutsTimer) { clearTimeout(snapLayoutsTimer); snapLayoutsTimer = null; }
        if (snapLayoutsEl) { snapLayoutsEl.remove(); snapLayoutsEl = null; }
    }
    function applySnapZone(w, zone) {
        if (!w.dataset.prevBounds) {
            w.dataset.prevBounds = JSON.stringify({
                left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height
            });
        }
        w.classList.add('snapping');
        w.classList.remove('maximized');
        const tbH = (taskbarHeight || 48);
        const W = window.innerWidth, H = window.innerHeight - tbH;
        const map = {
            'left':   {l:0,         t:0,    w:W/2,     h:H},
            'right':  {l:W/2,       t:0,    w:W/2,     h:H},
            'left2':  {l:0,         t:0,    w:W*2/3,   h:H},
            'right2': {l:W*2/3,     t:0,    w:W/3,     h:H},
            'l3':     {l:0,         t:0,    w:W/3,     h:H},
            'm3':     {l:W/3,       t:0,    w:W/3,     h:H},
            'r3':     {l:W*2/3,     t:0,    w:W/3,     h:H},
            'tl':     {l:0,         t:0,    w:W/2,     h:H/2},
            'tr':     {l:W/2,       t:0,    w:W/2,     h:H/2},
            'bl':     {l:0,         t:H/2,  w:W/2,     h:H/2},
            'br':     {l:W/2,       t:H/2,  w:W/2,     h:H/2}
        };
        const r = map[zone]; if (!r) return;
        w.style.left = r.l + 'px'; w.style.top = r.t + 'px';
        w.style.width = r.w + 'px'; w.style.height = r.h + 'px';
        setTimeout(() => w.classList.remove('snapping'), 240);
    }
    // Attach hover listeners to maximize buttons whenever windows are created
    const __observer = new MutationObserver(() => {
        document.querySelectorAll('.maximize:not([data-snap-bound])').forEach(btn => {
            btn.setAttribute('data-snap-bound', '1');
            const win = btn.closest('.app-window');
            let hoverTimer = null;
            btn.addEventListener('mouseenter', () => {
                hoverTimer = setTimeout(() => {
                    if (win) showSnapLayouts(win, btn.getBoundingClientRect());
                }, 380);
            });
            btn.addEventListener('mouseleave', () => {
                if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
                snapLayoutsTimer = setTimeout(hideSnapLayouts, 280);
            });
        });
    });
    __observer.observe(document.body, { childList: true, subtree: true });

    // ---------- 7) GLOBAL SEARCH PALETTE ----------
    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    const searchResultsDiv = document.getElementById('searchResults');
    let searchActiveIdx = 0, searchCurrentItems = [];

    function openSearchPalette() {
        searchOverlay.classList.add('show');
        searchInput.value = '';
        renderSearchResults('');
        setTimeout(() => searchInput.focus(), 30);
    }
    function closeSearchPalette() { searchOverlay.classList.remove('show'); }
    function renderSearchResults(query) {
        const q = (query || '').trim().toLowerCase();
        const all = getAppCatalog();
        const matched = q ? all.filter(it => it.name.toLowerCase().includes(q)) : all.slice(0, 12);
        searchCurrentItems = matched;
        searchActiveIdx = 0;
        if (matched.length === 0) {
            searchResultsDiv.innerHTML = `<div class="search-empty">No matches for "${escapeHtml(query)}"</div>`;
            return;
        }
        searchResultsDiv.innerHTML = matched.map((it, i) => `
            <div class="search-result${i===0?' active':''}" data-idx="${i}">
                ${iconHtmlFor(it, 22)}
                <div class="sr-name">${escapeHtml(it.name)}</div>
                <div class="sr-kind">${it.kind}</div>
            </div>`).join('');
        searchResultsDiv.querySelectorAll('.search-result').forEach(el => {
            el.addEventListener('mouseenter', () => setSearchActive(parseInt(el.dataset.idx, 10)));
            el.addEventListener('click', () => runSearchActive());
        });
    }
    function setSearchActive(i) {
        searchActiveIdx = Math.max(0, Math.min(searchCurrentItems.length - 1, i));
        searchResultsDiv.querySelectorAll('.search-result').forEach((el, idx) => el.classList.toggle('active', idx === searchActiveIdx));
        const active = searchResultsDiv.querySelector('.search-result.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
    }
    function runSearchActive() {
        const it = searchCurrentItems[searchActiveIdx];
        if (!it) return;
        closeSearchPalette();
        try { it.run(); } catch(e) { console.warn(e); }
    }
    searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setSearchActive(searchActiveIdx + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setSearchActive(searchActiveIdx - 1); }
        else if (e.key === 'Enter') { e.preventDefault(); runSearchActive(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeSearchPalette(); }
    });
    searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearchPalette(); });
    document.getElementById('searchBtn').addEventListener('click', openSearchPalette);

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        // Ctrl+Space -> Search
        if (e.ctrlKey && (e.code === 'Space' || e.key === ' ')) {
            e.preventDefault();
            if (searchOverlay.classList.contains('show')) closeSearchPalette(); else openSearchPalette();
            return;
        }
        // Ctrl+Tab -> Task View
        if (e.ctrlKey && e.key === 'Tab') {
            e.preventDefault();
            if (taskviewOverlay.classList.contains('show')) closeTaskView(); else openTaskView();
            return;
        }
        // Ctrl + Arrows -> switch workspaces
        if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
            // Don't hijack arrow keys when typing in inputs
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
            e.preventDefault();
            const cur = window.__activeWorkspace;
            const next = e.key === 'ArrowRight' ? cur + 1 : cur - 1;
            if (next >= 0 && next < window.__workspaces.length) switchWorkspace(next);
            return;
        }
        // Ctrl+Shift+L -> Lock
        if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
            e.preventDefault(); showLockScreen(); return;
        }
        // Esc closes overlays
        if (e.key === 'Escape') {
            if (taskviewOverlay.classList.contains('show')) closeTaskView();
            else if (searchOverlay.classList.contains('show')) closeSearchPalette();
        }
    });

    // ---------- 8) LOCK / LOGIN SCREEN ----------
    const lockScreen = document.getElementById('lockScreen');

    let lockTickHandle = null;

    function applyLockWallpaper() {
        const wp = wallpaperDataURL || wallpaperUrl;
        if (wp) lockScreen.style.backgroundImage = `url("${wp}")`;
        else lockScreen.style.background = `linear-gradient(135deg, #0a1a2e, #1b4332 60%, #0a0f1a)`;

    function tickLockClock() {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        lockClock.textContent = `${hh}:${mm}`;

    // ============== 1. AUDIO ENGINE (WebAudio synth — no files) ==============
    const Audio2026 = (function(){
        let ctx = null, masterGain = null, muted = false, volume = 0.5;
        function ensure() {
            if (!ctx) {
                try {
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = ctx.createGain();
                    masterGain.gain.value = volume;
                    masterGain.connect(ctx.destination);
                } catch(e) { return null; }
            }
            if (ctx.state === 'suspended') ctx.resume();
            return ctx;
        }
        function tone(freq, dur, type, vol) {
            if (muted) return;
            const c = ensure(); if (!c) return;
            const o = c.createOscillator(), g = c.createGain();
            o.type = type || 'sine';
            o.frequency.setValueAtTime(freq, c.currentTime);
            g.gain.setValueAtTime(0, c.currentTime);
            g.gain.linearRampToValueAtTime((vol||0.3), c.currentTime + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
            o.connect(g); g.connect(masterGain);
            o.start(); o.stop(c.currentTime + dur + 0.05);
        }
        function chord(freqs, dur, type, vol) { freqs.forEach(f => tone(f, dur, type, (vol||0.2))); }
        return {
            click: () => tone(1200, 0.04, 'square', 0.08),
            ding: () => { tone(880, 0.12, 'sine', 0.18); setTimeout(()=>tone(1318, 0.18, 'sine', 0.14), 90); },
            error: () => { tone(220, 0.18, 'sawtooth', 0.18); setTimeout(()=>tone(180, 0.22, 'sawtooth', 0.18), 160); },
            startup: () => {
                chord([523.25, 659.25, 783.99], 0.6, 'sine', 0.12);
                setTimeout(()=>chord([659.25, 783.99, 987.77], 0.7, 'sine', 0.14), 350);
                setTimeout(()=>chord([783.99, 987.77, 1174.66], 1.0, 'sine', 0.10), 750);
            },
            lock: () => { tone(600, 0.08, 'sine', 0.15); setTimeout(()=>tone(450, 0.12, 'sine', 0.15), 80); },
            unlock: () => { tone(450, 0.08, 'sine', 0.15); setTimeout(()=>tone(700, 0.14, 'sine', 0.15), 80); },
            notify: () => { tone(987.77, 0.08, 'triangle', 0.16); setTimeout(()=>tone(1318.51, 0.14, 'triangle', 0.13), 80); },
            setVolume: (v) => { volume = Math.max(0, Math.min(1, v)); if (masterGain) masterGain.gain.value = muted ? 0 : volume; },
            setMuted: (m) => { muted = !!m; if (masterGain) masterGain.gain.value = muted ? 0 : volume; },
            getVolume: () => volume, isMuted: () => muted
        };
    })();

    // Tree: { type:'folder', name, children:[...] } | { type:'file', name, content, mime, modified }
    function defaultVFS() {
        return {
            type: 'folder', name: 'C:', children: [
                { type: 'folder', name: 'Users', children: [
                    { type: 'folder', name: 'Admin', children: [
                        { type: 'folder', name: 'Desktop', children: [] },

                        ]},
                        { type: 'folder', name: 'Downloads', children: [] },
                        { type: 'folder', name: 'Pictures', children: [] },
                        { type: 'folder', name: 'Music', children: [] }
                    ]}
                ]},
                { type: 'folder', name: 'Program Files', children: [
                    { type: 'folder', name: 'Windows', children: [
                        { type: 'file', name: 'system.cfg', content: 'os=Windows Server 2026\nbuild=26100.1\n', modified: Date.now() }
                    ]}
                ]},
                { type: 'folder', name: 'Recycle Bin', children: [] }
            ]
        };
    }
    let VFS = (function(){
        try { const s = localStorage.getItem('win2026_vfs'); if (s) return JSON.parse(s); } catch(e){}
        return defaultVFS();
    })();
    function saveVFS() { try { localStorage.setItem('win2026_vfs', JSON.stringify(VFS)); } catch(e){} }
    function vfsResolve(path) {
        // path like "C:\Users\Admin\Documents"
        const parts = path.replace(/^[Cc]:[\\/]?/, '').split(/[\\/]+/).filter(Boolean);
        let node = VFS;
        for (const p of parts) {
            if (node.type !== 'folder') return null;
            const child = node.children.find(c => c.name.toLowerCase() === p.toLowerCase());
            if (!child) return null;
            node = child;
        }
        return node;
    }
    function vfsParent(path) {
        const norm = path.replace(/[\\/]+$/, '');
        const idx = Math.max(norm.lastIndexOf('\\'), norm.lastIndexOf('/'));
        if (idx <= 2) return 'C:\\';
        return norm.substring(0, idx);
    }
    function vfsJoin(path, name) {
        if (path.endsWith('\\') || path.endsWith('/')) return path + name;
        return path + '\\' + name;
    }
    function vfsMkdir(path, name) {
        const node = vfsResolve(path);
        if (!node || node.type !== 'folder') return false;
        if (node.children.some(c => c.name.toLowerCase() === name.toLowerCase())) return false;
        node.children.push({ type: 'folder', name, children: [] });
        saveVFS(); return true;
    }
    function vfsWriteFile(path, name, content) {
        const node = vfsResolve(path);
        if (!node || node.type !== 'folder') return false;
        const existing = node.children.find(c => c.name.toLowerCase() === name.toLowerCase());
        if (existing) { existing.content = content; existing.modified = Date.now(); }
        else node.children.push({ type: 'file', name, content, modified: Date.now() });
        saveVFS(); return true;
    }
    function vfsDelete(path, name) {
        const node = vfsResolve(path);
        if (!node || node.type !== 'folder') return false;
        const idx = node.children.findIndex(c => c.name.toLowerCase() === name.toLowerCase());
        if (idx < 0) return false;
        const removed = node.children.splice(idx, 1)[0];
        // move to Recycle Bin
        const rb = vfsResolve('C:\\Recycle Bin');
        if (rb) { removed._origin = path; rb.children.push(removed); }
        saveVFS(); return true;
    }
    function vfsRename(path, oldName, newName) {
        const node = vfsResolve(path);
        if (!node) return false;
        const item = node.children.find(c => c.name.toLowerCase() === oldName.toLowerCase());
        if (!item) return false;
        if (node.children.some(c => c !== item && c.name.toLowerCase() === newName.toLowerCase())) return false;
        item.name = newName;
        if (item.type === 'file') item.modified = Date.now();
        saveVFS(); return true;
    }
    function vfsRestore(name) {
        const rb = vfsResolve('C:\\Recycle Bin');
        if (!rb) return false;
        const idx = rb.children.findIndex(c => c.name === name);
        if (idx < 0) return false;
        const item = rb.children[idx];
        const dest = vfsResolve(item._origin || 'C:\\Users\\Admin\\Desktop');
        if (!dest) return false;
        rb.children.splice(idx, 1);
        delete item._origin;
        dest.children.push(item);
        saveVFS(); return true;
    }
    function vfsEmptyRecycle() {
        const rb = vfsResolve('C:\\Recycle Bin');
        if (rb) { rb.children = []; saveVFS(); }
    }
    window.VFS2026 = { resolve: vfsResolve, mkdir: vfsMkdir, write: vfsWriteFile, delete: vfsDelete, rename: vfsRename, save: saveVFS };

    function openTaskManager() {
        if (openWindows.has('taskmgr')) { const _tw=openWindows.get('taskmgr').windowElement; _tw.style.display = 'flex'; _tw.style.zIndex=Date.now(); return; }
        const html = `
            <div class="tm-root">
                <div class="tm-tabs">
                    <div class="tm-tab active" data-tmt="proc">Processes</div>
                    <div class="tm-tab" data-tmt="perf">Performance</div>
                </div>
                <div id="tmContent"></div>
            </div>`;
        const win = createWindow('Task Manager', html, 'taskmgr');
        document.body.appendChild(win); win.style.zIndex = Date.now();
        win.style.zIndex = Date.now();
        let activeTab = 'proc';
        const content = win.querySelector('#tmContent');
        win.querySelectorAll('.tm-tab').forEach(t => t.onclick = () => {
            win.querySelectorAll('.tm-tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active'); activeTab = t.getAttribute('data-tmt'); render();
        });
        // Fake process list seeded from open windows + system processes
        const sysProcs = [
            { name: 'System Idle Process', pid: 0, base: 0.2, mem: 8 },
            { name: 'System', pid: 4, base: 1, mem: 24 },
            { name: 'Registry', pid: 124, base: 0.5, mem: 12 },
            { name: 'csrss.exe', pid: 480, base: 0.8, mem: 18 },
            { name: 'winlogon.exe', pid: 612, base: 0.3, mem: 14 },
            { name: 'services.exe', pid: 720, base: 1.2, mem: 32 },
            { name: 'svchost.exe', pid: 856, base: 2.5, mem: 64 },
            { name: 'explorer.exe', pid: 1244, base: 3.5, mem: 92 },
            { name: 'WinDefender.exe', pid: 1820, base: 1.8, mem: 156 },
            { name: 'AudioService.exe', pid: 2040, base: 0.4, mem: 18 }
        ];
        function genProcesses() {
            const procs = sysProcs.map(p => ({ ...p, cpu: Math.max(0, p.base + (Math.random()-0.5)*1.5), mem: p.mem + (Math.random()-0.5)*4 }));
            for (let [id, info] of openWindows.entries()) {
                procs.push({ name: (info.title||id) + '.exe', pid: 3000 + Array.from(openWindows.keys()).indexOf(id), cpu: Math.random()*4, mem: 40 + Math.random()*120, killable: id });
            }
            return procs;
        }
        function render() {
            const procs = genProcesses();
            const totalCpu = Math.min(100, procs.reduce((s,p)=>s+p.cpu, 0));
            const totalMem = procs.reduce((s,p)=>s+p.mem, 0);
            const memPct = Math.min(100, (totalMem / 8192) * 100);
            if (activeTab === 'proc') {
                content.innerHTML = `
                    <div class="tm-stats">
                        <div class="tm-stat"><div class="tm-stat-label">CPU</div><div class="tm-stat-val">${totalCpu.toFixed(0)}%</div><div class="tm-bar"><div class="tm-bar-fill ${totalCpu>70?'high':''}" style="width:${totalCpu}%"></div></div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Memory</div><div class="tm-stat-val">${memPct.toFixed(0)}%</div><div class="tm-bar"><div class="tm-bar-fill ${memPct>70?'high':''}" style="width:${memPct}%"></div></div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Disk</div><div class="tm-stat-val">${(Math.random()*15).toFixed(0)}%</div><div class="tm-bar"><div class="tm-bar-fill" style="width:${Math.random()*15}%"></div></div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Network</div><div class="tm-stat-val">${(Math.random()*8).toFixed(1)}M</div><div class="tm-bar"><div class="tm-bar-fill" style="width:${Math.random()*30}%"></div></div></div>
                    </div>
                    <div class="tm-scroll">
                    <table class="tm-table"><thead><tr><th>Name</th><th>PID</th><th>CPU</th><th>Memory</th><th></th></tr></thead><tbody>
                    ${procs.sort((a,b)=>b.cpu-a.cpu).map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${p.pid}</td><td>${p.cpu.toFixed(1)}%</td><td>${p.mem.toFixed(0)} MB</td><td>${p.killable?`<button class="tm-end" data-kill="${p.killable}">End task</button>`:''}</td></tr>`).join('')}
                    </tbody></table></div>`;
                content.querySelectorAll('[data-kill]').forEach(b => b.onclick = () => {
                    const id = b.getAttribute('data-kill');
                    const info = openWindows.get(id);
                    if (info) { info.windowElement.remove(); openWindows.delete(id); updateTaskbarButtons(); notify('Task ended', info.title, { kind: 'warn' }); }
                });
            } else {
                content.innerHTML = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div class="tm-stat"><div class="tm-stat-label">CPU — Intel Xeon W-2026 @ 3.6GHz</div><div class="tm-stat-val">${totalCpu.toFixed(0)}%</div><div class="tm-bar"><div class="tm-bar-fill ${totalCpu>70?'high':''}" style="width:${totalCpu}%"></div></div><div style="font-size:11px;opacity:0.6;margin-top:8px;">Cores: 16 · Threads: 32 · Uptime: ${formatUptime()}</div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Memory — 8.0 GB DDR5</div><div class="tm-stat-val">${(totalMem/1024).toFixed(2)} / 8 GB</div><div class="tm-bar"><div class="tm-bar-fill ${memPct>70?'high':''}" style="width:${memPct}%"></div></div><div style="font-size:11px;opacity:0.6;margin-top:8px;">In use · ${(8 - totalMem/1024).toFixed(2)} GB available</div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Disk 0 (C:) — 512 GB SSD</div><div class="tm-stat-val">${(Math.random()*15).toFixed(0)}%</div><div class="tm-bar"><div class="tm-bar-fill" style="width:${Math.random()*15}%"></div></div></div>
                        <div class="tm-stat"><div class="tm-stat-label">Network — Ethernet</div><div class="tm-stat-val">${(Math.random()*100).toFixed(0)} Kbps</div><div class="tm-bar"><div class="tm-bar-fill" style="width:${Math.random()*40}%"></div></div></div>
                    </div>`;
            }
        }
        const bootTime = Date.now();
        function formatUptime() { const s = Math.floor((Date.now()-bootTime)/1000); return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
        render();
        if (tmInterval) clearInterval(tmInterval);
        tmInterval = setInterval(() => { if (openWindows.has('taskmgr')) render(); else { clearInterval(tmInterval); tmInterval = null; } }, 1500);
    }

    // ============== 7. CMD UPGRADE — File system commands ==============
    // Wrap the existing initCMD by extending what `proc` understands.
    // Strategy: re-implement initCMD to add VFS commands (dir, cd, mkdir, type, echo, cls, ipconfig, ver, whoami, exit).
    const _originalCmdUI = window.cmdUI || cmdUI;
    window.cmdUI = function() {
        return `<div class="cmd-output" id="cmdOut" style="height:280px;overflow-y:auto;background:#0c0f1a;color:#0f0;font-family:Consolas,monospace;font-size:13px;padding:8px;">Microsoft Windows Server [Version 10.0.26100.1]<br>(c) Microsoft Corporation. All rights reserved.<br><br></div><div class="cmd-input-line" style="display:flex;background:#0c0f1a;padding:0 8px 8px;font-family:Consolas,monospace;"><span class="cmd-prompt" id="cmdPrompt" style="color:#0f0;">C:\\Users\\Admin&gt;</span><input id="cmdInp" class="cmd-input" style="flex:1;background:transparent;border:none;color:#0f0;font-family:Consolas,monospace;font-size:13px;outline:none;margin-left:4px;" autofocus></div>`;
    };
    window.initCMD = function(win) {
        let out = win.querySelector('#cmdOut'), inp = win.querySelector('#cmdInp'), prompt2 = win.querySelector('#cmdPrompt');
        let cwd = 'C:\\Users\\Admin';
        let history = []; let histIdx = -1;
        function setCwd(p) { cwd = p; prompt2.innerHTML = escapeHtml(cwd) + '&gt;'; }
        function add(t, color) { const d = document.createElement('div'); if (color) d.style.color = color; d.innerHTML = t; out.appendChild(d); out.scrollTop = out.scrollHeight; }
        function resolveRel(arg) {
            if (!arg) return cwd;
            if (/^[Cc]:/.test(arg)) return arg;
            if (arg === '..') return vfsParent(cwd);
            return vfsJoin(cwd, arg);
        }
        function proc(line) {
            const raw = line.trim();
            if (!raw) return;
            const parts = raw.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
            const cmd = parts[0].toLowerCase(); const args = parts.slice(1).map(a => a.replace(/^"|"$/g, ''));
            switch(cmd) {
                case 'help':
                    add('Available commands:', '#5fb0ff');
                    add('  dir, cd, mkdir/md, rmdir/rd, type, echo, cls, copy, del, ren, ipconfig, ver, whoami, time, date, exit, open [app], shutdown, restart, taskmgr');
                    break;
                case 'dir': {
                    const target = args[0] ? resolveRel(args[0]) : cwd;
                    const node = vfsResolve(target);
                    if (!node || node.type !== 'folder') { add(`The system cannot find the path: ${target}`, '#f66'); break; }
                    add(` Volume in drive C is OS<br> Directory of ${escapeHtml(target)}<br>`);
                    let files = 0, dirs = 0;
                    node.children.forEach(c => {
                        const d = new Date(c.modified || Date.now());
                        const date = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        if (c.type === 'folder') { dirs++; add(`${date}    &lt;DIR&gt;          ${escapeHtml(c.name)}`); }
                        else { files++; const sz = (c.content||'').length; add(`${date}    ${String(sz).padStart(14,' ')} ${escapeHtml(c.name)}`); }
                    });
                    add(`<br>          ${files} File(s)<br>          ${dirs} Dir(s)`);
                    break;
                }
                case 'cd': case 'chdir': {
                    if (!args[0]) { add(cwd); break; }
                    const target = resolveRel(args[0]);
                    const node = vfsResolve(target);
                    if (!node || node.type !== 'folder') { add(`The system cannot find the path specified.`, '#f66'); break; }
                    setCwd(target);
                    break;
                }
                case 'mkdir': case 'md': {
                    if (!args[0]) { add('Syntax: mkdir <name>', '#f66'); break; }
                    if (vfsMkdir(cwd, args[0])) add(''); else add('Folder already exists or invalid.', '#f66');
                    break;
                }
                case 'rmdir': case 'rd': case 'del': case 'erase': {
                    if (!args[0]) { add('Syntax: del <name>', '#f66'); break; }
                    if (vfsDelete(cwd, args[0])) add(`${args[0]} → moved to Recycle Bin`); else add('File/folder not found.', '#f66');
                    break;
                }
                case 'type': {
                    if (!args[0]) { add('Syntax: type <file>', '#f66'); break; }
                    const node = vfsResolve(cwd);
                    const f = node && node.children.find(c => c.name.toLowerCase() === args[0].toLowerCase() && c.type === 'file');
                    if (!f) { add('File not found.', '#f66'); break; }
                    add(escapeHtml(f.content || '').replace(/\n/g, '<br>'));
                    break;
                }
                case 'echo': {
                    const m = raw.match(/^echo\s+(.+?)\s*>\s*(\S+)$/i);
                    if (m) { vfsWriteFile(cwd, m[2], m[1]); add(''); }
                    else add(args.join(' '));
                    break;
                }
                case 'copy': {
                    if (args.length < 2) { add('Syntax: copy <src> <dest>', '#f66'); break; }
                    const node = vfsResolve(cwd);
                    const f = node && node.children.find(c => c.name.toLowerCase() === args[0].toLowerCase());
                    if (!f) { add('Source not found.', '#f66'); break; }
                    vfsWriteFile(cwd, args[1], f.content || ''); add('        1 file(s) copied.');
                    break;
                }
                case 'ren': case 'rename': {
                    if (args.length < 2) { add('Syntax: ren <old> <new>', '#f66'); break; }
                    if (vfsRename(cwd, args[0], args[1])) add(''); else add('Cannot rename.', '#f66');
                    break;
                }
                case 'cls': out.innerHTML = ''; break;
                case 'ver': add('Microsoft Windows Server [Version 10.0.26100.1]'); break;
                case 'whoami': add('windows-server-2026\\admin'); break;
                case 'ipconfig':
                    add('Windows IP Configuration<br>');
                    add('Ethernet adapter Ethernet0:<br>   Connection-specific DNS Suffix . : localdomain');
                    add('   IPv4 Address. . . . . . . . . . . : 192.168.1.42');
                    add('   Subnet Mask . . . . . . . . . . . : 255.255.255.0');
                    add('   Default Gateway . . . . . . . . . : 192.168.1.1');
                    break;
                case 'time': add('The current time is: ' + new Date().toLocaleTimeString()); break;
                case 'date': add('The current date is: ' + new Date().toLocaleDateString()); break;
                case 'exit': { for (let [id,info] of openWindows.entries()) if (info.windowElement === win) { win.remove(); openWindows.delete(id); updateTaskbarButtons(); break; } return; }
                case 'taskmgr': openTaskManager(); break;
                case 'shutdown': add('Shutting down...'); setTimeout(()=>shutdown(), 600); break;
                case 'restart': add('Restarting...'); setTimeout(()=>restart(), 600); break;
                case 'open': {
                    const map = {paint:'paint',mypc:'myPC',ie:'ie',notepad:'notepad',games:'games',store:'store',office:'office',cmd:'cmd',explorer:'__explorer'};
                    const t = map[(args[0]||'').toLowerCase()];
                    if (t === '__explorer') openFileExplorer(cwd);
                    else if (t) launchApp(t);
                    else add('Unknown application.', '#f66');
                    break;
                }
                case '666': add('⚠️ FORBIDDEN! CHAOS ENGAGED ⚠️', '#f66'); setTimeout(()=>{ try { trigger666Chaos(); } catch(e){} }, 100); break;
                default: add(`'${parts[0]}' is not recognized as an internal or external command.`, '#f66');
            }
        }
        setCwd(cwd);
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const v = inp.value;
                if (v.trim()) { history.unshift(v); histIdx = -1; }
                add(`${escapeHtml(cwd)}&gt; ${escapeHtml(v)}`, '#fff');
                proc(v); inp.value = '';
            } else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx < history.length-1) { histIdx++; inp.value = history[histIdx]; }}
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx > 0) { histIdx--; inp.value = history[histIdx]; } else { histIdx = -1; inp.value = ''; }}
        });
        win.addEventListener('click', () => inp.focus());
    };

            const k = t.getAttribute('data-tg');
            if (k === 'lock') { closeTrayPopup(); showLockScreen(); return; }
            trayState[k] = !trayState[k];
            t.classList.toggle('on');
            if (k === 'nightlight') document.getElementById('desktop').style.filter = trayState.nightlight ? 'sepia(0.3) saturate(0.85) hue-rotate(-15deg)' : '';
            if (k === 'wifi') {
                const txtEl = document.getElementById('internetStatusText');
                const icoEl = document.getElementById('internetStatusIcon');
                if (txtEl) txtEl.textContent = trayState.wifi ? 'Online' : 'Disconnected';
                if (icoEl) {
                    const col = trayState.wifi ? 'white' : 'rgba(255,255,255,0.25)';
                    icoEl.innerHTML = [
                        `<rect x="1"  y="17" width="4" height="6"  rx="1" fill="${trayState.wifi?col:'rgba(255,255,255,0.25)'}"/>`,
                        `<rect x="7"  y="12" width="4" height="11" rx="1" fill="${trayState.wifi?col:'rgba(255,255,255,0.25)'}"/>`,
                        `<rect x="13" y="7"  width="4" height="16" rx="1" fill="${trayState.wifi?'white':'rgba(255,255,255,0.25)'}"/>`,
                        `<rect x="19" y="2"  width="4" height="21" rx="1" fill="${trayState.wifi?'white':'rgba(255,255,255,0.25)'}" />`
                    ].join('');
                }
                // Also swap net icon between wifi and disconnected
                const netIcon = document.getElementById('netIcon');
                if (netIcon) netIcon.innerHTML = trayState.wifi
                    ? `<path d="M1 9l2 2c5.27-4.93 13.73-4.93 19 0l2-2C16.73 2.93 7.27 2.93 1 9zm8 8l3 3 3-3c-1.65-1.65-4.35-1.65-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>`
                    : `<path d="M20.9 14.33l-2-2C19.6 11.57 20 10.33 20 9c0-2.76-1.12-5.26-2.93-7.07L15.5 3.5C16.96 4.96 18 6.88 18 9c0 1.09-.28 2.12-.76 3.01L15.5 10.27C15.8 9.88 16 9.46 16 9c0-1.1-.45-2.1-1.17-2.83L13.25 7.75C13.72 8.22 14 8.58 14 9c0 .55-.45 1-1 1s-1-.45-1-1c0-.42.28-.78.75-.25L11.17 7.17C10.45 7.9 10 8.9 10 10c0 1.1.45 2.1 1.17 2.83L9.5 14.5c-1.48-1.48-2.4-3.52-2.4-5.5 0-1.55.45-3 1.23-4.22L6.7 3.15A10.95 10.95 0 0 0 5 9c0 2.76 1.12 5.26 2.93 7.07L9.5 14.5 12 17l2.5-2.5 1.57 1.57L19 19l1.41-1.41-2-2zm-9.65-9.65L12 6l.75-.75-.75-.75-.75.75.75.75z" opacity=".5"/><line x1="2" y1="2" x2="22" y2="22" stroke="white" stroke-width="2"/>`;
                notify('Wi-Fi', trayState.wifi ? 'Connected to Home-Network-5G' : 'Disconnected', { kind: trayState.wifi?'success':'warn' });
            }
            else if (k === 'airplane') notify('Airplane Mode', trayState.airplane ? 'Wireless turned off' : 'Wireless turned on');
            else notify(k.charAt(0).toUpperCase()+k.slice(1), trayState[k] ? 'On' : 'Off');
        });
    };

    // Battery removed (PC mode - no battery needed)
    document.getElementById('trayNotifications').onclick = (e) => {
        e.stopPropagation();
        trayPopup(`
            <h4>Notifications</h4>
            ${notifLog.length === 0 ? '<div style="opacity:0.6;font-size:12px;padding:10px 0;">No new notifications</div>' :
                notifLog.slice(0, 8).map(n => `<div style="background:rgba(255,255,255,0.05);padding:8px 10px;border-radius:6px;margin-bottom:6px;"><div style="font-weight:600;font-size:12px;">${n.title}</div><div style="font-size:11px;opacity:0.7;">${n.body}</div><div style="font-size:10px;opacity:0.5;margin-top:2px;">${new Date(n.time).toLocaleTimeString()}</div></div>`).join('')
            }
            <button class="fx-tb-btn" style="width:100%;margin-top:6px;" id="clrNotif">Clear all</button>
        `);
        document.getElementById('clrNotif').onclick = () => { notifLog = []; closeTrayPopup(); };
    };

    // ============== 9. CTRL+ALT+DEL SECURITY SCREEN ==============
    function showSecurityScreen() {
        if (document.getElementById('secureScreen')) return;
        const s = document.createElement('div');
        s.id = 'secureScreen'; s.className = 'secure-screen';
        s.innerHTML = `
            <div class="sec-title">Windows Server 2026</div>
            <button class="sec-btn" data-sec="lock">🔒  Lock</button>
            <button class="sec-btn" data-sec="signout">🚪  Sign out</button>
            <button class="sec-btn" data-sec="taskmgr">📊  Task Manager</button>
            <button class="sec-btn" data-sec="shutdown">⏻  Shutdown</button>
            <div class="sec-cancel">Cancel (Esc)</div>`;
        document.body.appendChild(s);
        const close = () => s.remove();
        s.querySelector('.sec-cancel').onclick = close;
        s.addEventListener('click', e => { if (e.target === s) close(); });
        s.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
            const a = b.getAttribute('data-sec'); close();
            if (a === 'lock') showLockScreen();
            else if (a === 'taskmgr') openTaskManager();
            else if (a === 'shutdown') shutdown();
            else if (a === 'signout') { try { logout(); } catch(e){} showLockScreen(); }
        });
        const onEsc = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); }};
        document.addEventListener('keydown', onEsc);
    }

    // ============== 10. KEYBOARD SHORTCUTS ==============
    document.addEventListener('keydown', (e) => {
        // Skip when typing in inputs (except special combos)
        const inField = e.target.matches('input, textarea, [contenteditable="true"]');
        if (e.ctrlKey && e.altKey && (e.key === 'Delete' || e.key === '.')) { e.preventDefault(); showSecurityScreen(); return; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'Escape' || e.key === 'Esc')) { e.preventDefault(); openTaskManager(); return; }
        if (e.metaKey || e.key === 'Meta' || e.key === 'OS') {
            // best-effort Win key combos
        }
        if (inField) return;
        if (e.altKey && e.key === 'F4') {
            e.preventDefault();
            const last = Array.from(openWindows.entries()).pop();
            if (last) { last[1].windowElement.remove(); openWindows.delete(last[0]); updateTaskbarButtons(); }
        }
    });

    // ============== 11. WIRE NEW APPS / BUTTONS ==============
    // Override launchApp to support new in-process apps without breaking original
    const _originalLaunchApp = launchApp;
    window.launchApp = function(id) {
        if (id === 'explorer' || id === 'fileExplorer') { openFileExplorer(); return; }
        if (id === 'taskmgr') { openTaskManager(); return; }
        if (id === 'run') { openRunDialog(); return; }
        return _originalLaunchApp(id);
    };
    // Start menu buttons are already wired via buildStartMenuGrid() SM_PINNED_APPS actions.
    // Do NOT re-wire explorerBtn/taskMgrBtn/runBtn here — doing so caused the double File Explorer bug.

    setTimeout(() => {
        Audio2026.startup();
        setTimeout(() => notify('Welcome back', 'Windows Server 2026 is ready.', { kind: 'success', icon: '🌟' }), 1200);
        setTimeout(() => notify('Windows Update', '3 updates available. Click to install.', { icon: '🔄' }), 3500);
        setTimeout(() => notify('Network', 'Connected to Home-Network-5G', { icon: '📶', kind: 'success' }), 5500);
    }, 500);

    })();
</script>
</body>
