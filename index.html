        .sm-power-icon:hover { background:rgba(255,255,255,0.12); }
        .sm-power-flyout { position:absolute; bottom:68px; right:14px; background:rgba(36,36,36,0.96); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:6px; z-index:1200; min-width:170px; box-shadow:0 12px 40px rgba(0,0,0,0.6); animation:smFlyIn 0.15s cubic-bezier(.2,.8,.2,1); display:none; }

        .sm-all-apps-list.show { display:flex; }

        .sm-all-back { display:none; align-items:center; gap:8px; padding:4px 10px; border-radius:6px; border:none; background:rgba(255,255,255,0.08); color:white; cursor:pointer; font-size:12px; margin-left:auto; font-family:'Segoe UI',sans-serif; }

        /* Legacy compat */
        .divider { height:1px; background:rgba(255,255,255,0.07); margin:4px 0; }
         .app-window { position: absolute; background: #ece9e0; border-radius: 12px 12px 8px 8px; box-shadow: 0 12px 28px rgba(0,0,0,0.5); min-width: 450px; min-height: 400px; width: 550px; height: 500px; z-index: 500; display: flex; flex-direction: column; resize: both; overflow: auto; border: 1px solid #aaa; transition: border-radius 0.2s, left 0.22s cubic-bezier(.2,.8,.2,1), top 0.22s cubic-bezier(.2,.8,.2,1), width 0.22s cubic-bezier(.2,.8,.2,1), height 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s; will-change: transform, opacity; transform-origin: var(--tx, 50%) var(--ty, 100%); }
         .app-window.snapping { transition: left 0.18s cubic-bezier(.2,.8,.2,1), top 0.18s cubic-bezier(.2,.8,.2,1), width 0.18s cubic-bezier(.2,.8,.2,1), height 0.18s cubic-bezier(.2,.8,.2,1), border-radius 0.18s; }
         .app-window.dragging { transition: none !important; box-shadow: 0 18px 40px rgba(0,0,0,0.55); }
         .app-window.maximized { border-radius: 0 !important; resize: none !important; }
         .app-window.maximized .window-header { border-radius: 0 !important; }
         .app-window.opening { animation: winOpen 0.22s cubic-bezier(.2,.8,.2,1) both; }
         .app-window.closing { animation: winClose 0.18s cubic-bezier(.4,0,1,1) both; pointer-events: none; }
         .app-window.minimizing { animation: winMinimize 0.22s cubic-bezier(.4,0,1,1) both; pointer-events: none; }
         .app-window.restoring { animation: winRestore 0.24s cubic-bezier(.2,.8,.2,1) both; }
         @keyframes winOpen { 0% { opacity: 0; transform: scale(0.86) translateY(8px); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1) translateY(0); } }
         @keyframes winClose { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.92) translateY(6px); } }
         @keyframes winMinimize { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.25) translate(var(--mx,0px), var(--my,300px)); } }
         @keyframes winRestore { 0% { opacity: 0; transform: scale(0.25) translate(var(--mx,0px), var(--my,300px)); } 100% { opacity: 1; transform: scale(1) translate(0,0); } }
         .window-header { background: linear-gradient(90deg, #2c5a3e, #1f3e2c); padding: 8px 12px; border-radius: 10px 10px 0 0; cursor: grab; color: white; font-weight: bold; display: flex; justify-content: space-between; transition: background 0.2s; }
         .window-header:active { cursor: grabbing; }
         .window-controls { display: flex; gap: 12px; }
         .window-controls span { cursor: pointer; font-weight: bold; background: rgba(0,0,0,0.3); width: 24px; text-align: center; border-radius: 4px; transition: background 0.15s; }
         .window-controls span:hover { background: rgba(255,255,255,0.3); }
         .window-content { flex: 1; padding: 12px; background: #fef9e8; overflow: auto; }
         .taskbar-app-btn.launching { animation: tbBounce 0.6s cubic-bezier(.2,.8,.2,1) 2; }

         .snap-preview.show { opacity: 1; }

         /* ===== Pinned taskbar apps + drag-reorder ===== */
         .taskbar-pinned { display: flex; gap: 6px; align-items: center; padding-right: 8px; border-right: 1px solid rgba(255,255,255,0.18); margin-right: 8px; }
         .pinned-app { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, background 0.15s; position: relative; }

         /* ===== Snap Layouts popup (Win 11) ===== */
         .snap-layouts { position: fixed; background: rgba(28,28,32,0.96); backdrop-filter: blur(20px); border: 1px solid #444; border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(2, 130px); gap: 12px; z-index: 2147483647; box-shadow: 0 12px 30px rgba(0,0,0,0.6); animation: snapLayoutsIn 0.18s ease-out; }

         .snap-layout-card { width: 130px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid #555; border-radius: 6px; padding: 6px; display: grid; gap: 4px; cursor: pointer; }

         .snap-layout-card.layout-3col { grid-template-columns: 1fr 1fr 1fr; }

         /* ===== Virtual desktops switcher (Task View) ===== */
         .taskview-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.12); color: white; cursor: pointer; font-size: 18px; transition: 0.12s; margin-right: 6px; }
         .taskview-btn:hover { background: rgba(255,255,255,0.28); }

         .taskview-overlay.show { display: flex; }
         @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
         .taskview-windows { flex: 1; width: 100%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; align-content: start; overflow-y: auto; padding: 10px; }
         .taskview-window-card { background: rgba(40,40,46,0.88); border: 1px solid #555; border-radius: 10px; padding: 14px; color: white; cursor: pointer; transition: transform 0.15s, border-color 0.15s; min-height: 140px; display: flex; flex-direction: column; }
         .taskview-window-card:hover { transform: scale(1.03); border-color: #5fb0ff; }

        .toast { background: rgba(28, 32, 42, 0.96); backdrop-filter: blur(16px); color: white; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); border-left: 3px solid #5fb0ff; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: auto; animation: toastIn 0.3s ease-out; min-width: 260px; cursor: pointer; }
        .toast.error { border-left-color: #ff5d5d; }
        .toast.success { border-left-color: #4caf50; }
        .toast.warn { border-left-color: #f0a020; }
        .toast.exit { animation: toastOut 0.25s ease-in forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: none; } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(100%); } }
        .toast-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .toast-body { font-size: 12px; opacity: 0.85; }

        /* ===== File Explorer (Windows 11 style) ===== */
        .fx-root { display: flex; flex-direction: column; height: 100%; min-height: 360px; background: #f3f3f3; color: #1a1a1a; font-size: 13px; font-family: 'Segoe UI', sans-serif; }
        .fx-titlebar { background: #fafafa; border-bottom: 1px solid #e5e5e5; padding: 4px 8px; display: flex; align-items: center; gap: 6px; }
        .fx-nav-btn { width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #444; transition: background 0.1s; }
        .fx-nav-btn:hover { background: rgba(0,0,0,0.06); }
        .fx-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fx-address-bar { flex: 1; background: white; border: 1px solid #d0d0d0; border-radius: 6px; padding: 5px 12px; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .fx-address-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .fx-toolbar { background: #fafafa; border-bottom: 1px solid #e5e5e5; padding: 4px 10px; display: flex; align-items: center; gap: 4px; }
        .fx-tb-btn { background: transparent; border: none; color: #1a1a1a; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: background 0.1s; font-family: 'Segoe UI', sans-serif; }
        .fx-tb-btn:hover:not(:disabled) { background: rgba(0,0,0,0.07); }
        .fx-tb-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .fx-tb-sep { width: 1px; height: 20px; background: #d8d8d8; margin: 0 4px; }
        .fx-body { display: flex; flex: 1; min-height: 0; }
        .fx-side { width: 200px; background: #f0f0f0; padding: 8px 0; border-right: 1px solid #e0e0e0; overflow-y: auto; }
        .fx-side-section { font-size: 11px; text-transform: uppercase; color: #777; padding: 10px 14px 4px; letter-spacing: 0.5px; font-weight: 600; }
        .fx-side-item { padding: 6px 14px; border-radius: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #1a1a1a; font-size: 13px; margin: 1px 6px; border-radius: 6px; }
        .fx-side-item:hover { background: rgba(0,0,0,0.06); }
        .fx-side-item.active { background: rgba(0,120,212,0.12); color: #0078d4; }
        .fx-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: white; }
        .fx-grid { flex: 1; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 4px; align-content: start; }
        .fx-item { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 6px; cursor: pointer; user-select: none; text-align: center; transition: background 0.1s; }
        .fx-item:hover { background: rgba(0,120,212,0.08); }
        .fx-item.selected { background: rgba(0,120,212,0.15); outline: 1px solid rgba(0,120,212,0.4); }
        .fx-item .fx-ico { font-size: 38px; line-height: 1; margin-bottom: 5px; }
        .fx-item .fx-name { font-size: 11px; word-break: break-word; max-width: 86px; color: #1a1a1a; line-height: 1.3; }
        .fx-status { background: #f5f5f5; border-top: 1px solid #e5e5e5; padding: 4px 14px; font-size: 11px; color: #666; }
        .fx-empty { grid-column: 1/-1; text-align: center; padding: 60px; opacity: 0.45; font-style: italic; font-size: 14px; color: #666; }

        /* ===== Task Manager ===== */
        .tm-root { background: #1a1d28; color: #eee; min-height: 380px; padding: 12px; font-size: 13px; }
        .tm-tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .tm-tab { padding: 8px 16px; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 12px; }
        .tm-tab.active { background: rgba(95,176,255,0.18); }
        .tm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .tm-stat { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; }
        .tm-stat-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
        .tm-stat-val { font-size: 22px; font-weight: 300; margin-top: 2px; }
        .tm-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .tm-bar-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #5fb0ff); transition: width 0.4s; }
        .tm-bar-fill.high { background: linear-gradient(90deg, #f0a020, #ff5d5d); }
        .tm-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .tm-table th { text-align: left; padding: 6px; opacity: 0.7; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; background: #1a1d28; }
        .tm-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tm-table tr:hover { background: rgba(255,255,255,0.04); }
        .tm-end { background: #c43c3c; border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .tm-scroll { max-height: 240px; overflow-y: auto; }

        /* ===== Run dialog ===== */
        .run-dialog { padding: 16px; min-width: 380px; background: #2a2f3a; color: white; }
        .run-dialog input { width: 100%; padding: 6px 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); color: white; border-radius: 4px; font-size: 13px; margin: 8px 0; }
        .run-dialog .run-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .run-dialog button { background: rgba(95,176,255,0.25); border: 1px solid rgba(95,176,255,0.4); color: white; padding: 5px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .run-dialog button:hover { background: rgba(95,176,255,0.4); }

        /* ===== CTRL+ALT+DEL security screen ===== */
        .secure-screen { position: fixed; inset: 0; background: rgba(0,30,60,0.92); backdrop-filter: blur(20px); z-index: 14000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 14px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .secure-screen .sec-title { font-size: 28px; font-weight: 200; margin-bottom: 16px; }
        .secure-screen .sec-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 32px; min-width: 260px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s; text-align: left; }

        .secure-screen .sec-cancel { margin-top: 20px; opacity: 0.6; cursor: pointer; font-size: 12px; }
    </style>
</head>

<script>
    (function(){
    // ==================== PERSISTENT STORAGE & ACCOUNT SYSTEM ====================
    let loggedIn = false;
    let accountUsername = "";
    let accountPassword = "";

    function loadAccount() {
        const saved = localStorage.getItem('win2026_account');
        if (saved) {
            try {
                const acc = JSON.parse(saved);
                if (acc.username && acc.password) {
                    loggedIn = true;
                    accountUsername = acc.username;
                    accountPassword = acc.password;
                } else {
                    loggedIn = false;
                }
            } catch(e) { loggedIn = false; }
        } else {
            loggedIn = false;
        }
    }

    function saveAccount() {
        if (loggedIn && accountUsername && accountPassword) {
            localStorage.setItem('win2026_account', JSON.stringify({ username: accountUsername, password: accountPassword }));
        } else {
            localStorage.removeItem('win2026_account');
        }
    }

    function createAccount(username, password) {
        if (!username || !password) return false;
        accountUsername = username;
        accountPassword = password;
        loggedIn = true;
        saveAccount();
        return true;
    }

    function changePassword(newPassword) {
        if (!loggedIn) return false;
        accountPassword = newPassword;
        saveAccount();
        return true;
    }

    function deleteAccount() {
        loggedIn = false;
        accountUsername = "";
        accountPassword = "";
        localStorage.removeItem('win2026_account');
        for (let [winId, info] of openWindows.entries()) {
            if (winId === 'office' || winId === 'store' || winId.startsWith('office_') || winId.startsWith('store_')) {
                info.windowElement.remove();
                openWindows.delete(winId);
            }
        }
        updateTaskbarButtons();
        alert("Account deleted. Microsoft Office and Store are now locked.");
    }

    function logoutAccount() {
        loggedIn = false;
        accountUsername = "";
        accountPassword = "";

    function onDragMove(e) {
        if(!dragTarget) return;
        let dx=Math.abs(e.clientX-dragStartX), dy=Math.abs(e.clientY-dragStartY);

            t=Math.min(Math.max(t,0),window.innerHeight-70);
            dragTarget.style.left=l+'px'; dragTarget.style.top=t+'px';
            // Highlight folder under cursor (only when dragging an app/game/file)

            document.querySelectorAll('.desktop-icon.folder-drop-target').forEach(el=>el.classList.remove('folder-drop-target'));
            if(dt==='app' || dt==='game' || dt==='file') {
                dragTarget.style.pointerEvents='none';

                dragTarget.style.pointerEvents='';

    function stopDrag(e) {
        if(!dragTarget) return;
        dragTarget.classList.remove('dragging');
        document.querySelectorAll('.desktop-icon.folder-drop-target').forEach(el=>el.classList.remove('folder-drop-target'));
        let type=dragTarget.getAttribute('data-type'), id=dragTarget.getAttribute('data-id');
        // Resolve element under cursor while ignoring the dragged item itself
        dragTarget.style.pointerEvents='none';
        let under = document.elementFromPoint(e.clientX,e.clientY);
        dragTarget.style.pointerEvents='';
        let recycle = under && under.closest('.desktop-icon[data-id="recycleBin"]');
        let folderIcon = under && under.closest('.desktop-icon[data-type="folder"]');
        // Drop on Recycle Bin
        if(recycle && (type==='app'||type==='file'||type==='game')) {
            if(type==='app' && !deletedApps.includes(id)) { deletedApps.push(id); }
            else if(type==='file') { desktopFiles=desktopFiles.filter(f=>f.id!=id); }

            dragTarget=null;
            document.removeEventListener('mousemove',onDragMove);
            document.removeEventListener('mouseup',stopDrag);
            saveState();
            return;
        }
        // Drop on a folder -> add to folder.contents
        if(folderIcon && folderIcon !== dragTarget && (type==='app'||type==='game'||type==='file')) {
            let folderId = folderIcon.getAttribute('data-id');
            let folder = customFolders.find(f=>String(f.id)===String(folderId));

                dragTarget=null;

                document.removeEventListener('mouseup',stopDrag);
                saveState();
                return;
            }
        }
        if(isDraggingForMove) {
            let l=parseFloat(dragTarget.style.left), t=parseFloat(dragTarget.style.top);
            if(type==='app') appPositions[id]={x:l,y:t};
            else if(type==='folder') { let f=customFolders.find(f=>f.id==id); if(f) { f.x=l; f.y=t; } }

    function initPaint(win) {
        // Remove padding from window content for clean look
        const wc = win.querySelector('.window-content');
        if (wc) { wc.style.padding = '0'; wc.style.overflow = 'hidden'; wc.style.background = '#f3f3f3'; }

        let canvas = win.querySelector('#paintCanvas'), ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
        let painting = false, tool = 'brush', color = '#000000', size = 4, startX, startY, textFontSize = 20;

        // Wire tool buttons
        win.querySelectorAll('[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                win.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tool = btn.getAttribute('data-tool').toLowerCase();
            });
        });
        // Wire color swatches
        win.querySelectorAll('.w11paint-swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                color = sw.getAttribute('data-color');
                win.querySelector('#pcolor').value = color;
                win.querySelectorAll('.w11paint-swatch').forEach(s => s.classList.remove('selected'));
                sw.classList.add('selected');
            });
        });
        let c = win.querySelector('#pcolor'), s = win.querySelector('#psize');
        let textSizeInput = win.querySelector('#textSize');
        let canvasWInput = win.querySelector('#canvasW'), canvasHInput = win.querySelector('#canvasH');
        let posEl = win.querySelector('#paintCursorPos'), sizeEl = win.querySelector('#paintCanvasSize');
        c.oninput = e => { color = e.target.value; win.querySelectorAll('.w11paint-swatch').forEach(sw => sw.classList.remove('selected')); };
        s && (s.oninput = e => size = parseInt(e.target.value));
        textSizeInput && (textSizeInput.oninput = e => textFontSize = parseInt(e.target.value));
        win.querySelector('#pclear').onclick = () => { ctx.fillStyle = 'white'; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillRect(0,0,canvas.width,canvas.height); };
        win.querySelector('#savePaint').onclick = () => {
            let fileName = prompt("Enter file name (without .png):", "MyDrawing") || "MyDrawing";
            fileName = fileName.replace(/[\\/:*?"<>|]/g, '') + ".png";
            let dataURL = canvas.toDataURL("image/png");
            let pos = getNextFreePosition();
            desktopFiles.push({ id: Date.now() + Math.random(), name: fileName, content: dataURL, x: pos.x, y: pos.y, isImage: true });
            renderDesktopIcons(); saveState(); alert(`Saved as "${fileName}" on desktop!`);
        };
        win.querySelector('#setWallpaperBtn').onclick = () => {
            wallpaperUrl = null; wallpaperDataURL = canvas.toDataURL("image/png");
            applyWallpaper(); saveState(); alert("Canvas set as desktop wallpaper!");
        };
        win.querySelector('#resizeCanvas').onclick = () => {
            let w = parseInt(canvasWInput.value) || 550, h = parseInt(canvasHInput.value) || 400;
            if (w < 100) w = 100; if (h < 100) h = 100;
            if (confirm(`Resize canvas to ${w}×${h}? This will clear the drawing.`)) {
                let saved = canvas.toDataURL();
                canvas.width = w; canvas.height = h;
                ctx.fillStyle = 'white'; ctx.fillRect(0,0,w,h);
                if (sizeEl) sizeEl.textContent = `${w} × ${h} px`;
            }
        };
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect(), sx = canvas.width/rect.width, sy = canvas.height/rect.height;
            let mx = Math.floor((e.clientX - rect.left)*sx), my = Math.floor((e.clientY - rect.top)*sy);
            if (posEl) posEl.textContent = `${mx}, ${my}`;
        });
        function setStroke() {
            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = (tool === 'eraser') ? 'white' : color;
        }
        function floodFill(x,y){
            let img = ctx.getImageData(0,0,canvas.width,canvas.height), data = img.data;
            let target = ctx.getImageData(x,y,1,1).data;
            let fill = [parseInt(color.slice(1,3),16), parseInt(color.slice(3,5),16), parseInt(color.slice(5,7),16), 255];
            if(target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2]) return;
            let stack = [{x,y}];
            while(stack.length){
                let {x:cx, y:cy} = stack.pop();
                if(cx<0||cy<0||cx>=canvas.width||cy>=canvas.height) continue;
                let idx = (cy*canvas.width+cx)*4;
                if(data[idx]===target[0]&&data[idx+1]===target[1]&&data[idx+2]===target[2]&&data[idx+3]===target[3]){
                    data[idx]=fill[0];data[idx+1]=fill[1];data[idx+2]=fill[2];data[idx+3]=fill[3];
                    stack.push({x:cx+1,y:cy},{x:cx-1,y:cy},{x:cx,y:cy+1},{x:cx,y:cy-1});
                }
            }
            ctx.putImageData(img,0,0);
        }
        canvas.addEventListener('mousedown', (e) => {
            let rect = canvas.getBoundingClientRect(), sx = canvas.width/rect.width, sy = canvas.height/rect.height;
            let mx = (e.clientX - rect.left)*sx, my = (e.clientY - rect.top)*sy;
            if (tool === 'picker') { let px = ctx.getImageData(mx,my,1,1).data; color = "#"+((1<<24)+(px[0]<<16)+(px[1]<<8)+px[2]).toString(16).slice(1); c.value=color; return; }
            if (tool === 'text') { let text=prompt("Enter text:","Hello"); if(text){ctx.font=`${textFontSize}px 'Segoe UI'`;ctx.fillStyle=color;ctx.fillText(text,mx,my);} return; }
            if (tool === 'fill') { floodFill(Math.floor(mx),Math.floor(my)); return; }
            painting = true; startX = mx; startY = my;
            if (tool === 'brush' || tool === 'eraser') { setStroke(); ctx.beginPath(); ctx.moveTo(mx,my); }
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!painting) return;
            let rect = canvas.getBoundingClientRect(), sx = canvas.width/rect.width, sy = canvas.height/rect.height;
            let mx = (e.clientX - rect.left)*sx, my = (e.clientY - rect.top)*sy;
            if (tool === 'brush' || tool === 'eraser') { setStroke(); ctx.lineTo(mx,my); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mx,my); }
            else if (tool === 'spray') { for(let i=0;i<25;i++){let ox=(Math.random()-.5)*size*2,oy=(Math.random()-.5)*size*2;ctx.fillStyle=color;ctx.fillRect(mx+ox,my+oy,1.5,1.5);} }
        });
        canvas.addEventListener('mouseup', (e) => {
            if (!painting) return;
            let rect = canvas.getBoundingClientRect(), sx = canvas.width/rect.width, sy = canvas.height/rect.height;
            let mx = (e.clientX - rect.left)*sx, my = (e.clientY - rect.top)*sy;
            if (tool === 'rect') { ctx.fillStyle = color; ctx.fillRect(Math.min(startX,mx),Math.min(startY,my),Math.abs(mx-startX),Math.abs(my-startY)); }
            else if (tool === 'circle') { let r=Math.hypot(mx-startX,my-startY); ctx.beginPath(); ctx.arc(startX,startY,r,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); }
            else if (tool === 'line') { ctx.beginPath(); ctx.moveTo(startX,startY); ctx.lineTo(mx,my); ctx.strokeStyle=color; ctx.lineWidth=size; ctx.lineCap='round'; ctx.stroke(); }
            painting = false; ctx.beginPath();
        });
        canvas.addEventListener('mouseleave', () => { painting = false; ctx.beginPath(); });
    }

    function initNotepad(win){
        const wc = win.querySelector('.window-content');
        if(wc){ wc.style.padding='0'; wc.style.overflow='hidden'; wc.style.background='#fff'; }
        win.style.width='680px'; win.style.height='520px';

        const ta = win.querySelector('#nt11');
        const statusBar = win.querySelector('#npStatusBar2');
        let zoom = 100, wordWrap = true, showStatus = true;
        let undoStack = [''], redoStack = [], lastVal = '';

        // --- Undo/Redo tracking ---
        ta.addEventListener('input', () => {
            if(ta.value !== lastVal) {
                undoStack.push(ta.value);
                if(undoStack.length > 200) undoStack.shift();
                redoStack = [];
                lastVal = ta.value;
            }
            updateStatus();
        });

        function updateStatus(){
            const val = ta.value;
            const lines = val.split('\n');
            const pos = ta.selectionStart;
            let lineNum=1, colNum=1;
            let cnt=0;
            for(let i=0;i<lines.length;i++){ if(cnt+lines[i].length>=pos){ lineNum=i+1; colNum=pos-cnt+1; break; } cnt+=lines[i].length+1; }
            win.querySelector('#npLinCol').textContent = `Ln ${lineNum}, Col ${colNum}`;
            win.querySelector('#npCharCount').textContent = `${val.length} char${val.length!==1?'s':''}`;
            const words = val.trim() ? val.trim().split(/\s+/).length : 0;
            win.querySelector('#npWordCount').textContent = `${words} word${words!==1?'s':''}`;
        }
        ta.addEventListener('click', updateStatus);
        ta.addEventListener('keyup', updateStatus);

        // Font/size controls
        const fontSel = win.querySelector('#npFont'), sizeSel = win.querySelector('#npFontSize');
        fontSel.onchange = () => { ta.style.fontFamily = fontSel.value; };
        sizeSel.onchange = () => { ta.style.fontSize = sizeSel.value + 'px'; };

        // Bold/Italic/Underline toggle (visual only on textarea, works as rich-text hint)
        const boldBtn = win.querySelector('#npBold'), italicBtn = win.querySelector('#npItalic'), ulBtn = win.querySelector('#npUnderline');
        boldBtn.onclick = () => { boldBtn.classList.toggle('active'); ta.style.fontWeight = boldBtn.classList.contains('active') ? 'bold' : 'normal'; };
        italicBtn.onclick = () => { italicBtn.classList.toggle('active'); ta.style.fontStyle = italicBtn.classList.contains('active') ? 'italic' : 'normal'; };
        ulBtn.onclick = () => { ulBtn.classList.toggle('active'); ta.style.textDecoration = ulBtn.classList.contains('active') ? 'underline' : 'none'; };

        // Align
        win.querySelector('#npAlignL').onclick = () => { ta.style.textAlign = 'left'; };
        win.querySelector('#npAlignC').onclick = () => { ta.style.textAlign = 'center'; };
        win.querySelector('#npAlignR').onclick = () => { ta.style.textAlign = 'right'; };

        // Text color
        win.querySelector('#npTextColor').oninput = (e) => { ta.style.color = e.target.value; };

        // Zoom
        function applyZoom(){ ta.style.fontSize = (14 * zoom / 100) + 'px'; win.querySelector('#npZoomVal').textContent = zoom + '%'; }
        win.querySelector('#npZoomInBtn').onclick = () => { zoom = Math.min(zoom + 10, 200); sizeSel.value = Math.round(14*zoom/100); applyZoom(); };
        win.querySelector('#npZoomOutBtn').onclick = () => { zoom = Math.max(zoom - 10, 50); applyZoom(); };

        // Menu dropdowns
        const menus = { file:'npDropFile', edit:'npDropEdit', view:'npDropView' };
        win.querySelectorAll('.w11np-menu-btn').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const key = btn.getAttribute('data-menu');
                win.querySelectorAll('.w11np-dropdown').forEach(d => d.classList.remove('show'));
                win.querySelectorAll('.w11np-menu-btn').forEach(b => b.classList.remove('active'));
                const dd = win.querySelector('#npDrop' + key.charAt(0).toUpperCase() + key.slice(1));
                if(dd){ dd.classList.add('show'); btn.classList.add('active'); }
            };
        });
        win.addEventListener('click', () => {
            win.querySelectorAll('.w11np-dropdown').forEach(d => d.classList.remove('show'));
            win.querySelectorAll('.w11np-menu-btn').forEach(b => b.classList.remove('active'));
        });

        // File menu actions
        win.querySelector('#npNew').onclick = () => { if(!ta.value || confirm("Discard current content?")){ ta.value=''; undoStack=[''];redoStack=[];lastVal=''; updateStatus(); } };
        win.querySelector('#npSaveDesk').onclick = () => {
            let name = prompt("File name:","Note");
            if(name){ name = name.endsWith('.txt') ? name : name + '.txt'; let pos=getNextFreePosition(); desktopFiles.push({id:Date.now()+Math.random(),name,content:ta.value,x:pos.x,y:pos.y,isImage:false}); renderDesktopIcons(); saveState(); notify('Notepad','Saved "'+name+'" to Desktop',{icon:'💾',kind:'success'}); }
        };
        win.querySelector('#npPrint').onclick = () => { window.print(); };
        win.querySelector('#npClose').onclick = () => { win.remove(); openWindows.delete('notepad'); updateTaskbarButtons(); };

        // Edit menu actions
        win.querySelector('#npUndo').onclick = () => { if(undoStack.length>1){ redoStack.push(undoStack.pop()); ta.value=undoStack[undoStack.length-1]||''; lastVal=ta.value; updateStatus(); } };
        win.querySelector('#npRedo').onclick = () => { if(redoStack.length){ const v=redoStack.pop(); undoStack.push(v); ta.value=v; lastVal=v; updateStatus(); } };
        win.querySelector('#npCut').onclick = () => { document.execCommand('cut'); };
        win.querySelector('#npCopy').onclick = () => { document.execCommand('copy'); };
        win.querySelector('#npPaste').onclick = () => { ta.focus(); document.execCommand('paste'); };
        win.querySelector('#npSelectAll').onclick = () => { ta.select(); };
        win.querySelector('#npDateTime').onclick = () => { const d=new Date(); const dt=d.toLocaleString(); const s=ta.selectionStart, e=ta.selectionEnd; ta.value=ta.value.slice(0,s)+dt+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+dt.length; updateStatus(); };

        // Find/Replace
        const findBar = win.querySelector('#npFindBar');
        const findInput = win.querySelector('#npFindInput');
        const replaceInput = win.querySelector('#npReplaceInput');
        const replaceBtn = win.querySelector('#npReplaceBtn');
        let isReplace = false, lastFindIdx = -1;

        win.querySelector('#npFind').onclick = () => { isReplace=false; replaceInput.style.display='none'; replaceBtn.style.display='none'; findBar.classList.add('show'); findInput.focus(); };
        win.querySelector('#npReplace').onclick = () => { isReplace=true; replaceInput.style.display=''; replaceBtn.style.display=''; findBar.classList.add('show'); findInput.focus(); };
        win.querySelector('#npFindClose').onclick = () => { findBar.classList.remove('show'); };
        win.querySelector('#npFindNext').onclick = () => {
            const q = findInput.value; if(!q) return;
            const txt = ta.value; const start = lastFindIdx >= 0 ? lastFindIdx+1 : 0;
            let idx = txt.indexOf(q, start);
            if(idx === -1) idx = txt.indexOf(q, 0);
            if(idx !== -1){ ta.focus(); ta.setSelectionRange(idx, idx+q.length); lastFindIdx=idx; updateStatus(); }
        };
        win.querySelector('#npFindPrev').onclick = () => {
            const q = findInput.value; if(!q) return;
            const txt = ta.value; const start = lastFindIdx > 0 ? lastFindIdx-1 : txt.length;
            let idx = txt.lastIndexOf(q, start);
            if(idx !== -1){ ta.focus(); ta.setSelectionRange(idx, idx+q.length); lastFindIdx=idx; updateStatus(); }
        };
        replaceBtn.onclick = () => {
            const q=findInput.value, r=replaceInput.value; if(!q) return;
            ta.value = ta.value.split(q).join(r); updateStatus();
        };

        // View menu
        win.querySelector('#npWordWrap').onclick = () => { wordWrap=!wordWrap; ta.wrap=wordWrap?'soft':'off'; win.querySelector('#npWrapLabel').textContent=(wordWrap?'✓ ':'  ')+'Word Wrap'; };
        win.querySelector('#npStatusBar').onclick = () => { showStatus=!showStatus; statusBar.style.display=showStatus?'':'none'; win.querySelector('#npStatLabel').textContent=(showStatus?'✓ ':'  ')+'Status Bar'; };
        win.querySelector('#npZoomIn').onclick = () => { zoom=Math.min(zoom+10,200); applyZoom(); };
        win.querySelector('#npZoomOut').onclick = () => { zoom=Math.max(zoom-10,50); applyZoom(); };
        win.querySelector('#npZoomReset').onclick = () => { zoom=100; applyZoom(); };

        // Keyboard shortcuts
        ta.addEventListener('keydown', (e) => {
            if(e.ctrlKey){
                if(e.key==='s'||e.key==='S'){e.preventDefault(); win.querySelector('#npSaveDesk').click();}
                else if(e.key==='n'||e.key==='N'){e.preventDefault(); win.querySelector('#npNew').click();}
                else if(e.key==='f'||e.key==='F'){e.preventDefault(); win.querySelector('#npFind').click();}
                else if(e.key==='h'||e.key==='H'){e.preventDefault(); win.querySelector('#npReplace').click();}
                else if(e.key==='a'||e.key==='A'){e.preventDefault(); ta.select();}
                else if(e.key==='z'||e.key==='Z'){e.preventDefault(); win.querySelector('#npUndo').click();}
                else if(e.key==='y'||e.key==='Y'){e.preventDefault(); win.querySelector('#npRedo').click();}
                else if(e.key==='+'||e.key==='='){e.preventDefault(); zoom=Math.min(zoom+10,200); applyZoom();}
                else if(e.key==='-'){e.preventDefault(); zoom=Math.max(zoom-10,50); applyZoom();}
                else if(e.key==='b'||e.key==='B'){e.preventDefault(); boldBtn.click();}
                else if(e.key==='i'||e.key==='I'){e.preventDefault(); italicBtn.click();}
                else if(e.key==='u'||e.key==='U'){e.preventDefault(); ulBtn.click();}
            }
            if(e.key==='F5'){e.preventDefault(); win.querySelector('#npDateTime').click();}
        });

        updateStatus();
    }

    function initCMD(win) { let out=win.querySelector('#cmdOut'), inp=win.querySelector('#cmdInp'); function add(t,e=false){ let d=document.createElement('div'); d.style.color=e?'#f66':'#0f0'; d.innerHTML=t; out.appendChild(d); out.scrollTop=out.scrollHeight; } function proc(c){ c=c.trim().toLowerCase(); if(c==='help') add("Commands: open [app], delete [app], restart pc, shutdown pc, 666\nApps: paint, mypc, ie, notepad, games, store, office, cmd"); else if(c.startsWith('open ')){ let an=c.substring(5); let map={paint:'paint',mypc:'myPC',ie:'ie',notepad:'notepad',games:'games',store:'store',office:'office',cmd:'cmd'}; if(map[an] && !deletedApps.includes(map[an])){ launchApp(map[an]); add(`Opening ${an}...`); } else add(`Error: ${an} not found or deleted.`,true); } else if(c.startsWith('delete ')){ let an=c.substring(7); let map={paint:'paint',mypc:'myPC',ie:'ie',notepad:'notepad',games:'games',store:'store',office:'office',cmd:'cmd'}; if(map[an] && !deletedApps.includes(map[an])){ deletedApps.push(map[an]); renderDesktopIcons(); if(openWindows.has('recycleBin')) refreshRecycleBin(); add(`${an} deleted.`); } else add(`Cannot delete ${an}.`,true); } else if(c==='restart pc'){ add("Restarting..."); setTimeout(()=>restart(),500); } else if(c==='shutdown pc'){ add("Shutting down..."); setTimeout(()=>shutdown(),500); } else if(c==='666'){ add("⚠️ FORBIDDEN! CHAOS ENGAGED ⚠️",true); setTimeout(()=>trigger666Chaos(),100); } else add(`'${c}' not recognized.`,true); } inp.addEventListener('keypress',e=>{ if(e.key==='Enter'){ let cmd=inp.value; if(cmd.trim()){ add(`C:\\> ${cmd}`); proc(cmd); } inp.value=''; } }); }

    function initGames(win){
        const hub     = win.querySelector('#ghHub');
        const backBtn = win.querySelector('#ghBackBtn');
        let activeGame = null, activeCleanup = null;

        const gameAreas = {};
        ['snake','pong','ttt','breakout','minesweeper'].forEach(id => {
            gameAreas[id] = win.querySelector('#game-' + id);
        });

        function showHub() {
            hub.style.display = '';
            Object.values(gameAreas).forEach(a => a.classList.remove('active'));
            backBtn.classList.remove('visible');
            win.querySelector('.gh-title').innerHTML = '<span>🎮</span> Games';
            if (activeCleanup) { activeCleanup(); activeCleanup = null; }
            activeGame = null;
        }

        function showGame(id, title, icon) {
            hub.style.display = 'none';
            Object.values(gameAreas).forEach(a => a.classList.remove('active'));
            gameAreas[id].classList.add('active');
            backBtn.classList.add('visible');
            win.querySelector('.gh-title').innerHTML = `<span>${icon}</span> ${title}`;
            activeGame = id;
        }

        backBtn.addEventListener('click', showHub);
        win.querySelector('.close-win').addEventListener('click', () => { if (activeCleanup) activeCleanup(); });

        hub.addEventListener('click', e => {
            const card = e.target.closest('.gh-card');
            if (!card) return;
            const id = card.dataset.game;
            const names = { snake:'Snake', pong:'Pong', ttt:'Tic-Tac-Toe', breakout:'Breakout', minesweeper:'Minesweeper' };
            const icons = { snake:'🐍', pong:'🏓', ttt:'⭕', breakout:'🧱', minesweeper:'💣' };
            showGame(id, names[id], icons[id]);
            if (activeCleanup) { activeCleanup(); activeCleanup = null; }
            if (id === 'snake')       activeCleanup = initSnake(win);
            else if (id === 'pong')   activeCleanup = initPong(win);
            else if (id === 'ttt')    activeCleanup = initTTT(win);
            else if (id === 'breakout') activeCleanup = initBreakout(win);
            else if (id === 'minesweeper') activeCleanup = initMinesweeper(win);
        });

        /* ---- SNAKE ---- */
        function initSnake(win) {
            const canvas = win.querySelector('#snakeCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = win.querySelector('#snakeScore');
            const bestEl  = win.querySelector('#snakeBest');
            const speedEl = win.querySelector('#snakeSpeed');
            const diffSel = win.querySelector('#snakeDiff');
            const restBtn = win.querySelector('#snakeRestart');
            let snake, dir, nextDir, food, bonus, score, best = 0, gameOver, gameInt, keyH;
            const GRID = 21, CELL = Math.floor(420 / GRID);
            const speedNames = { 150:'Slow', 110:'Normal', 70:'Fast', 40:'Insane' };

            function rnd() { return { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) }; }
            function newFood() {
                let f;
                do { f = rnd(); } while (snake.some(s => s.x===f.x && s.y===f.y));
                return f;
            }
            function newBonus() {
                if (Math.random() < 0.3) {
                    let f;
                    do { f = rnd(); } while (snake.some(s=>s.x===f.x&&s.y===f.y) || (f.x===food.x&&f.y===food.y));
                    return { ...f, ttl: 80 };
                }
                return null;
            }

            function startGame() {
                const mid = Math.floor(GRID/2);
                snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
                dir = nextDir = 'RIGHT';
                food = newFood(); bonus = null; score = 0; gameOver = false;
                scoreEl.textContent = '0';
                speedEl.textContent = speedNames[diffSel.value] || 'Normal';
                if (gameInt) clearInterval(gameInt);
                if (keyH) window.removeEventListener('keydown', keyH);
                keyH = e => {
                    if (!gameInt) return;
                    const m = {ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',
                                w:'UP',s:'DOWN',a:'LEFT',d:'RIGHT',
                                W:'UP',S:'DOWN',A:'LEFT',D:'RIGHT'};
                    const nd = m[e.key];
                    if (!nd) return;
                    const opp = {UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};
                    if (nd !== opp[dir]) { nextDir = nd; e.preventDefault(); }
                };
                window.addEventListener('keydown', keyH);
                gameInt = setInterval(update, parseInt(diffSel.value));
            }

            function update() {
                dir = nextDir;
                const head = { x: snake[0].x, y: snake[0].y };
                if (dir==='RIGHT') head.x++; else if (dir==='LEFT') head.x--;
                else if (dir==='UP') head.y--; else head.y++;
                if (head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)) {
                    clearInterval(gameInt); gameInt = null; gameOver = true;
                    if (score > best) { best = score; bestEl.textContent = best; }
                    draw(); return;
                }
                snake.unshift(head);
                if (head.x===food.x && head.y===food.y) {
                    score++; scoreEl.textContent = score;
                    food = newFood();
                    if (score % 5 === 0) bonus = newBonus();
                } else {
                    snake.pop();
                }
                if (bonus) {
                    bonus.ttl--;
                    if (head.x===bonus.x && head.y===bonus.y) { score += 3; scoreEl.textContent = score; bonus = null; }
                    else if (bonus.ttl <= 0) bonus = null;
                }
                draw();
            }

            function draw() {
                const W = canvas.width, H = canvas.height;
                ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,W,H);
                // Grid lines
                ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 0.5;
                for (let i=0;i<=GRID;i++) {
                    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(W,i*CELL); ctx.stroke();
                }
                // Food
                const fx = food.x*CELL+CELL/2, fy = food.y*CELL+CELL/2, fr = CELL/2-2;
                const foodGrad = ctx.createRadialGradient(fx,fy,1,fx,fy,fr);
                foodGrad.addColorStop(0,'#ff8a80'); foodGrad.addColorStop(1,'#d32f2f');
                ctx.fillStyle = foodGrad; ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
                // Bonus
                if (bonus) {
                    const bx = bonus.x*CELL+CELL/2, by = bonus.y*CELL+CELL/2;
                    const pulse = 0.85 + 0.15*Math.sin(bonus.ttl*0.25);
                    ctx.save(); ctx.globalAlpha = Math.min(1, bonus.ttl/20);
                    const bonusGrad = ctx.createRadialGradient(bx,by,1,bx,by,CELL/2*pulse);
                    bonusGrad.addColorStop(0,'#ffe082'); bonusGrad.addColorStop(1,'#f57f17');
                    ctx.fillStyle = bonusGrad; ctx.beginPath(); ctx.arc(bx,by,CELL/2*pulse-1,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.font=`bold ${CELL*0.5}px Segoe UI`; ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText('+3',bx,by); ctx.restore();
                }
                // Snake body
                for (let i = snake.length-1; i >= 0; i--) {
                    const s = snake[i], t = i/snake.length;
                    const r = CELL/2 - 1;
                    const sx = s.x*CELL+CELL/2, sy = s.y*CELL+CELL/2;
                    const grad = ctx.createRadialGradient(sx-r*0.3,sy-r*0.3,r*0.1,sx,sy,r);
                    if (i===0) { grad.addColorStop(0,'#a5f3a5'); grad.addColorStop(1,'#2d7a2d'); }
                    else { grad.addColorStop(0,`hsl(${120+t*20},70%,${55-t*15}%)`); grad.addColorStop(1,`hsl(${120+t*20},60%,${30-t*10}%)`); }
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, i===0?5:3); ctx.fill();
                    // Eyes on head
                    if (i===0) {
                        ctx.fillStyle = 'white';
                        const ex = dir==='LEFT'?-3:dir==='RIGHT'?3:1, ey = dir==='UP'?-3:dir==='DOWN'?3:1;
                        ctx.beginPath(); ctx.arc(sx+ex-ey*0.5, sy+ey+ex*0.5, 2.5, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(sx+ex+ey*0.5, sy+ey-ex*0.5, 2.5, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111';
                        ctx.beginPath(); ctx.arc(sx+ex-ey*0.5, sy+ey+ex*0.5, 1.2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(sx+ex+ey*0.5, sy+ey-ex*0.5, 1.2, 0, Math.PI*2); ctx.fill();
                    }
                }
                // Game Over overlay
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillStyle='white'; ctx.font='bold 32px Segoe UI'; ctx.fillText('Game Over',W/2,H/2-30);
                    ctx.font='18px Segoe UI'; ctx.fillText(`Score: ${score}${score>best?' 🏆 New Best!':''}`,W/2,H/2+10);
                    ctx.font='14px Segoe UI'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('Click "New Game" to play again',W/2,H/2+44);
                }
            }

            diffSel.addEventListener('change', startGame);
            restBtn.addEventListener('click', startGame);
            startGame();
            return () => { if(gameInt) clearInterval(gameInt); if(keyH) window.removeEventListener('keydown',keyH); };
        }

        /* ---- PONG ---- */
        function initPong(win) {
            const canvas = win.querySelector('#pongCanvas');
            const ctx = canvas.getContext('2d');
            const ps = win.querySelector('#pongPlayerScore');
            const as = win.querySelector('#pongAiScore');
            const diffSel = win.querySelector('#pongDiff');
            const restBtn = win.querySelector('#pongRestart');
            const W = canvas.width, H = canvas.height;
            const PH = 80, PW = 12, BR = 8;
            let pScore=0, aScore=0, ballX, ballY, ballDX, ballDY, paddleY, aiPaddleY, raf, paused=false, lastTime=0, mouseMoveH;

            function resetBall(dir=1) {
                ballX=W/2; ballY=H/2;
                const speed = parseFloat(diffSel.value) + 2;
                ballDX = speed * dir; ballDY = (Math.random()-0.5)*4;
            }
            function startGame() {
                pScore=0; aScore=0; ps.textContent='0'; as.textContent='0';
                paddleY = H/2-PH/2; aiPaddleY = H/2-PH/2;
                resetBall(); paused=false;
                if (raf) cancelAnimationFrame(raf);
                raf = requestAnimationFrame(loop);
            }

            function loop(ts) {
                if (!paused) {
                    const dt = Math.min((ts-lastTime)/16.67, 3); lastTime=ts;
                    ballX += ballDX * dt; ballY += ballDY * dt;
                    // Wall bounce
                    if (ballY-BR<0){ ballY=BR; ballDY=Math.abs(ballDY); }
                    if (ballY+BR>H){ ballY=H-BR; ballDY=-Math.abs(ballDY); }
                    // Player paddle
                    const pX = 20+PW, pHit = ballX-BR<=pX && ballX+BR>=20 && ballY>paddleY && ballY<paddleY+PH;
                    if (pHit) { ballDX=Math.abs(ballDX)+0.3; const rel=(ballY-(paddleY+PH/2))/(PH/2); ballDY=rel*6; }
                    // AI paddle
                    const aiX = W-20-PW, aiHit = ballX+BR>=aiX && ballX-BR<=W-20 && ballY>aiPaddleY && ballY<aiPaddleY+PH;
                    if (aiHit) { ballDX=-Math.abs(ballDX)-0.3; const rel=(ballY-(aiPaddleY+PH/2))/(PH/2); ballDY=rel*6; }
                    // Speed cap
                    const speed = Math.hypot(ballDX,ballDY);
                    if (speed>18){ ballDX=ballDX/speed*18; ballDY=ballDY/speed*18; }
                    // AI movement
                    const aiSpeed = parseFloat(diffSel.value);
                    const aiTarget = ballY - PH/2;
                    if (aiPaddleY < aiTarget) aiPaddleY = Math.min(aiPaddleY+aiSpeed*dt, aiTarget);
                    else aiPaddleY = Math.max(aiPaddleY-aiSpeed*dt, aiTarget);
                    aiPaddleY = Math.max(0,Math.min(H-PH,aiPaddleY));
                    // Score
                    if (ballX-BR<0){ aScore++; as.textContent=aScore; paused=true; setTimeout(()=>{ resetBall(1); paused=false; },700); }
                    if (ballX+BR>W){ pScore++; ps.textContent=pScore; paused=true; setTimeout(()=>{ resetBall(-1); paused=false; },700); }
                }
                draw(); raf=requestAnimationFrame(loop);
            }

            function draw() {
                ctx.fillStyle='#0a0f1e'; ctx.fillRect(0,0,W,H);
                // Center line
                ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
                // Paddles
                function drawPaddle(x,y,col) {
                    const grad=ctx.createLinearGradient(x,y,x+PW,y);
                    grad.addColorStop(0,col); grad.addColorStop(1,'rgba(255,255,255,0.3)');
                    ctx.fillStyle=grad;
                    ctx.beginPath(); ctx.roundRect(x,y,PW,PH,5); ctx.fill();
                    ctx.shadowBlur=12; ctx.shadowColor=col; ctx.fill(); ctx.shadowBlur=0;
                }
                drawPaddle(20, paddleY, '#63b3ed');
                drawPaddle(W-20-PW, aiPaddleY, '#fc8181');
                // Ball
                const bGrad=ctx.createRadialGradient(ballX-3,ballY-3,1,ballX,ballY,BR);
                bGrad.addColorStop(0,'white'); bGrad.addColorStop(1,'rgba(200,200,255,0.8)');
                ctx.fillStyle=bGrad; ctx.shadowBlur=16; ctx.shadowColor='rgba(150,180,255,0.8)';
                ctx.beginPath(); ctx.arc(ballX,ballY,BR,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
                // Scores
                ctx.textAlign='center'; ctx.font='bold 36px Segoe UI'; ctx.fillStyle='rgba(255,255,255,0.5)';
                ctx.fillText(pScore, W/4, 48); ctx.fillText(aScore, 3*W/4, 48);
            }

            canvas.addEventListener('mousemove', mouseMoveH = e => {
                const rect=canvas.getBoundingClientRect();
                paddleY = Math.max(0,Math.min(H-PH,(e.clientY-rect.top)*(H/rect.height)-PH/2));
            });

            diffSel.addEventListener('change', startGame);
            restBtn.addEventListener('click', startGame);
            startGame();
            return () => { if(raf) cancelAnimationFrame(raf); canvas.removeEventListener('mousemove',mouseMoveH); };
        }

        /* ---- TIC TAC TOE ---- */
        function initTTT(win) {
            const board = win.querySelector('#tttBoard');
            const msg   = win.querySelector('#tttMsg');
            const youEl = win.querySelector('#tttYouScore');
            const tieEl = win.querySelector('#tttTieScore');
            const aiEl  = win.querySelector('#tttAiScore');
            const restBtn = win.querySelector('#tttRestart');
            let cells, state, over, youScore=0, tieScore=0, aiScore=0, aiThinking=false;
            const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

            function minimax(b, isMax, depth, alpha, beta) {
                const w = checkWin(b);
                if (w==='O') return 10-depth;
                if (w==='X') return depth-10;
                if (b.every(v=>v)) return 0;
                if (isMax) {
                    let best=-Infinity;
                    for(let i=0;i<9;i++) if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,false,depth+1,alpha,beta));b[i]=null;alpha=Math.max(alpha,best);if(beta<=alpha)break;}
                    return best;
                } else {
                    let best=Infinity;
                    for(let i=0;i<9;i++) if(!b[i]){b[i]='X';best=Math.min(best,minimax(b,true,depth+1,alpha,beta));b[i]=null;beta=Math.min(beta,best);if(beta<=alpha)break;}
                    return best;
                }
            }
            function checkWin(b) {
                for(const l of LINES) if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]) return b[l[0]];
                return null;
            }
            function getWinLine(b) {
                for(const l of LINES) if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]) return l;
                return null;
            }

            function newGame() {
                state=Array(9).fill(null); over=false; aiThinking=false;
                board.innerHTML='';
                cells=[];
                for(let i=0;i<9;i++){
                    const c=document.createElement('div');
                    c.className='ttt-cell'; c.dataset.i=i;
                    c.addEventListener('click',()=>playerClick(i));
                    board.appendChild(c); cells.push(c);
                }
                msg.style.color='white';
                msg.textContent='Your turn (X)';
            }

            function playerClick(i) {
                if(over||state[i]||aiThinking) return;
                state[i]='X';
                cells[i].textContent='✕'; cells[i].classList.add('taken','x-cell');
                cells[i].style.animation='none'; setTimeout(()=>{cells[i].style.animation='';},10);
                const w=checkWin(state);
                if(w||(state.every(v=>v))) { endGame(w); return; }
                msg.textContent='AI is thinking…'; aiThinking=true;
                setTimeout(()=>{
                    let best=-Infinity, move=-1;
                    for(let i=0;i<9;i++) if(!state[i]){ state[i]='O'; const s=minimax(state,false,0,-Infinity,Infinity); state[i]=null; if(s>best){best=s;move=i;} }
                    if(move!==-1){ state[move]='O'; cells[move].textContent='◯'; cells[move].classList.add('taken','o-cell'); }
                    aiThinking=false;
                    const w2=checkWin(state);
                    if(w2||(state.every(v=>v))) { endGame(w2); } else { msg.textContent='Your turn (X)'; }
                }, 300);
            }

            function endGame(winner) {
                over=true;
                if(winner){
                    const line=getWinLine(state);
                    if(line) line.forEach(i=>cells[i].classList.add('winner-cell'));
                    if(winner==='X'){youScore++;youEl.textContent=youScore;msg.style.color='#63b3ed';msg.textContent='🎉 You win!';}
                    else{aiScore++;aiEl.textContent=aiScore;msg.style.color='#fc8181';msg.textContent='🤖 AI wins!';}
                } else {
                    tieScore++;tieEl.textContent=tieScore;msg.style.color='#fbbf24';msg.textContent="🤝 It's a tie!";
                }
            }

            restBtn.addEventListener('click', newGame);
            newGame();
            return () => {};
        }

        /* ---- BREAKOUT ---- */
        function initBreakout(win) {
            const canvas = win.querySelector('#brkCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = win.querySelector('#brkScore');
            const livesEl = win.querySelector('#brkLives');
            const levelEl = win.querySelector('#brkLevel');
            const restBtn = win.querySelector('#brkRestart');
            const W=canvas.width, H=canvas.height;
            const PW=90, PH=12, BR=8;
            let paddle, ball, bricks, score, lives, level, raf, over, won, mouseMoveH, keyH;
            const COLS=10, ROWS=5;
            const COLORS=[['#63b3ed','#2b6cb0'],['#68d391','#276749'],['#f6ad55','#c05621'],['#fc8181','#c53030'],['#b794f4','#6b46c1']];

            function makeBricks(lvl) {
                const bricks=[];
                const bw=(W-40)/COLS, bh=22, pad=3;
                for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
                    const hits = r<2?1: r<4?2:3;
                    bricks.push({x:20+c*(bw+pad), y:50+r*(bh+pad), w:bw-pad, h:bh-pad, hits, maxHits:hits, col:COLORS[r]});
                }
                // Extra row on higher levels
                if(lvl>=2) for(let c=0;c<COLS;c++){
                    bricks.push({x:20+c*((W-40)/COLS+pad), y:50+ROWS*(bh+pad), w:(W-40)/COLS-pad, h:bh-pad, hits:2, maxHits:2, col:COLORS[1]});
                }
                return bricks;
            }

            function startGame(resetLevel=true) {
                if(resetLevel){ score=0; lives=3; level=1; }
                paddle={x:W/2-PW/2, y:H-30, w:PW, h:PH};
                const speed = 4.5+level*0.5;
                const ang=(Math.random()*0.6+0.8)*Math.PI; // upward random angle
                ball={x:W/2, y:H-50, r:BR, dx:Math.cos(ang)*speed, dy:-Math.abs(Math.sin(ang)*speed)};
                bricks=makeBricks(level); over=false; won=false;
                scoreEl.textContent=score; levelEl.textContent=level;
                livesEl.textContent='❤️'.repeat(lives);
                if(raf) cancelAnimationFrame(raf);
                raf=requestAnimationFrame(loop);
            }

            function loop() {
                update(); draw();
                if(!over) raf=requestAnimationFrame(loop);
            }

            function update() {
                ball.x+=ball.dx; ball.y+=ball.dy;
                if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=Math.abs(ball.dx);}
                if(ball.x+ball.r>W){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);}
                if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=Math.abs(ball.dy);}
                // Paddle collision
                if(ball.y+ball.r>=paddle.y && ball.y+ball.r<=paddle.y+PH && ball.x>=paddle.x && ball.x<=paddle.x+PW && ball.dy>0){
                    ball.dy=-Math.abs(ball.dy);
                    const rel=(ball.x-(paddle.x+PW/2))/(PW/2);
                    ball.dx=rel*6; ball.y=paddle.y-ball.r;
                    const sp=Math.hypot(ball.dx,ball.dy); const maxSp=10;
                    if(sp>maxSp){ball.dx=ball.dx/sp*maxSp;ball.dy=ball.dy/sp*maxSp;}
                }
                // Lose life
                if(ball.y>H+20){ lives--; livesEl.textContent='❤️'.repeat(Math.max(0,lives)); if(lives<=0){over=true;draw();return;} ball={...ball,x:W/2,y:H-50,dx:(Math.random()-0.5)*6,dy:-5}; }
                // Brick collision
                for(let b of bricks){
                    if(b.hits<=0) continue;
                    if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
                        b.hits--;
                        score+=(b.maxHits)*10; scoreEl.textContent=score;
                        // Determine bounce direction
                        const overlapL=ball.x+ball.r-b.x, overlapR=b.x+b.w-(ball.x-ball.r);
                        const overlapT=ball.y+ball.r-b.y, overlapB=b.y+b.h-(ball.y-ball.r);
                        const minH=Math.min(overlapL,overlapR), minV=Math.min(overlapT,overlapB);
                        if(minH<minV) ball.dx=-ball.dx; else ball.dy=-ball.dy;
                        break;
                    }
                }
                // Win check
                if(bricks.every(b=>b.hits<=0)){ level++; if(level>5){over=true;won=true;draw();return;} setTimeout(()=>startGame(false),800); }
            }

            function draw() {
                ctx.fillStyle='#080c14'; ctx.fillRect(0,0,W,H);
                // Bricks
                bricks.forEach(b=>{
                    if(b.hits<=0) return;
                    const t=b.hits/b.maxHits;
                    const [c1,c2]=b.col;
                    const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
                    g.addColorStop(0,c1); g.addColorStop(1,c2);
                    ctx.fillStyle=g; ctx.globalAlpha=0.5+0.5*t;
                    ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
                    ctx.globalAlpha=1;
                    // Shine
                    ctx.fillStyle='rgba(255,255,255,0.15)';
                    ctx.beginPath(); ctx.roundRect(b.x+2,b.y+2,b.w-4,4,2); ctx.fill();
                });
                // Paddle
                const pGrad=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+PH);
                pGrad.addColorStop(0,'#63b3ed'); pGrad.addColorStop(1,'#2b6cb0');
                ctx.fillStyle=pGrad; ctx.beginPath(); ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6); ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.roundRect(paddle.x+4,paddle.y+2,paddle.w-8,4,2); ctx.fill();
                // Ball
                const ballGrad=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);
                ballGrad.addColorStop(0,'white'); ballGrad.addColorStop(1,'#a3c4f3');
                ctx.fillStyle=ballGrad; ctx.shadowBlur=14; ctx.shadowColor='#63b3ed';
                ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
                // Overlays
                if(over){
                    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillStyle='white'; ctx.font='bold 32px Segoe UI';
                    ctx.fillText(won?'🎉 You Win!':'💀 Game Over',W/2,H/2-24);
                    ctx.font='18px Segoe UI'; ctx.fillText('Score: '+score,W/2,H/2+14);
                    ctx.font='13px Segoe UI'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillText('Click "New Game" to retry',W/2,H/2+46);
                }
            }

            canvas.addEventListener('mousemove', mouseMoveH = e=>{
                const rect=canvas.getBoundingClientRect();
                paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-rect.left)*(W/rect.width)-PW/2));
            });
            keyH = e=>{
                if(e.key==='ArrowLeft') paddle.x=Math.max(0,paddle.x-18);
                if(e.key==='ArrowRight') paddle.x=Math.min(W-PW,paddle.x+18);
            };
            window.addEventListener('keydown',keyH);
            restBtn.addEventListener('click',()=>startGame(true));
            startGame(true);
            return ()=>{ if(raf) cancelAnimationFrame(raf); canvas.removeEventListener('mousemove',mouseMoveH); window.removeEventListener('keydown',keyH); };
        }

        /* ---- MINESWEEPER ---- */
        function initMinesweeper(win) {
            const boardEl = win.querySelector('#msBoard');
            const remEl   = win.querySelector('#msRemaining');
            const timerEl = win.querySelector('#msTimer');
            const diffSel = win.querySelector('#msDiff');
            const restBtn = win.querySelector('#msRestart');
            const configs = { easy:{rows:9,cols:9,mines:10}, medium:{rows:12,cols:12,mines:20}, hard:{rows:16,cols:16,mines:40} };
            let cells, mines, revealed, flagged, firstClick, over, won, startTime, timerInt;

            function startGame() {
                const cfg=configs[diffSel.value]||configs.medium;
                const {rows,cols,mines:mineCount}=cfg;
                cells=[]; mines=new Set(); revealed=new Set(); flagged=new Set();
                firstClick=true; over=false; won=false; startTime=null;
                if(timerInt) clearInterval(timerInt);
                timerEl.textContent='0s'; remEl.textContent=mineCount;
                boardEl.style.gridTemplateColumns=`repeat(${cols},32px)`;
                boardEl.innerHTML='';
                for(let i=0;i<rows*cols;i++){
                    const c=document.createElement('div');
                    c.className='ms-cell'; c.dataset.i=i;
                    c.addEventListener('click',()=>reveal(i,rows,cols,mineCount));
                    c.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i,mineCount);});
                    boardEl.appendChild(c); cells.push(c);
                }
            }

            function placeMines(rows,cols,mineCount,safe) {
                while(mines.size<mineCount){
                    const r=Math.floor(Math.random()*rows*cols);
                    const adj=getNeighbors(safe,rows,cols);
                    if(r!==safe && !adj.includes(r)) mines.add(r);
                }
            }

            function getNeighbors(i,rows,cols) {
                const r=Math.floor(i/cols),c=i%cols,nb=[];
                for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
                    if(dr===0&&dc===0) continue;
                    const nr=r+dr,nc=c+dc;
                    if(nr>=0&&nr<rows&&nc>=0&&nc<cols) nb.push(nr*cols+nc);
                }
                return nb;
            }

            function countAdj(i,rows,cols){ return getNeighbors(i,rows,cols).filter(n=>mines.has(n)).length; }

            function reveal(i,rows,cols,mineCount) {
                if(over||revealed.has(i)||flagged.has(i)) return;
                if(firstClick){ firstClick=false; placeMines(rows,cols,mineCount,i); startTime=Date.now(); timerInt=setInterval(()=>{timerEl.textContent=Math.floor((Date.now()-startTime)/1000)+'s';},500); }
                if(mines.has(i)){
                    // Hit a mine
                    over=true; clearInterval(timerInt);
                    mines.forEach(m=>{ cells[m].textContent='💣'; cells[m].classList.add('revealed'); });
                    cells[i].classList.add('mine-hit');
                    return;
                }
                const stack=[i];
                while(stack.length){
                    const idx=stack.pop();
                    if(revealed.has(idx)) continue;
                    revealed.add(idx);
                    const c=cells[idx]; c.classList.add('revealed');
                    const adj=countAdj(idx,rows,cols);
                    if(adj>0){ c.textContent=adj; c.dataset.n=adj; }
                    else { getNeighbors(idx,rows,cols).forEach(n=>{ if(!revealed.has(n)&&!mines.has(n)) stack.push(n); }); }
                }
                // Win check
                const cfg=configs[diffSel.value]||configs.medium;
                if(revealed.size===cfg.rows*cfg.cols-mines.size){ over=true; won=true; clearInterval(timerInt); remEl.textContent='🎉'; }
            }

            function toggleFlag(i,mineCount) {
                if(over||revealed.has(i)) return;
                if(flagged.has(i)){ flagged.delete(i); cells[i].textContent=''; cells[i].classList.remove('flagged'); }
                else if(flagged.size<mineCount){ flagged.add(i); cells[i].textContent='🚩'; cells[i].classList.add('flagged'); }
                remEl.textContent=Math.max(0,mineCount-flagged.size)+(won?'🎉':'');
            }

            diffSel.addEventListener('change',startGame);
            restBtn.addEventListener('click',startGame);
            startGame();
            return ()=>{ if(timerInt) clearInterval(timerInt); };
        }
    }

    function openCalendar() {
        const now = new Date();
        let currentYear = now.getFullYear(), currentMonth = now.getMonth();
        const renderCalendar = (container, year, month) => {
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            let html = `<div class="calendar-nav"><button id="prevMonth">◀ Prev</button><span>${new Date(year, month).toLocaleString('default', { month: 'long' })} ${year}</span><button id="nextMonth">Next ▶</button></div><table class="calendar"><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>`;
            let day = 1;
            for (let i = 0; i < 6; i++) {
                html += '<tr>';
                for (let j = 0; j < 7; j++) {
                    if (i === 0 && j < firstDay) html += `<td></td>`;
                    else if (day > daysInMonth) html += `<td></td>`;
                    else { const isToday = (day === now.getDate() && month === now.getMonth() && year === now.getFullYear()); html += `<td class="${isToday ? 'today' : ''}">${day}</td>`; day++; }
                }
                html += '</tr>';
                if (day > daysInMonth) break;
            }
            html += '</table>';
            container.innerHTML = html;
            container.querySelector('#prevMonth').onclick = () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(container, currentYear, currentMonth); };
            container.querySelector('#nextMonth').onclick = () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(container, currentYear, currentMonth); };
        };
        const win = createWindow('Calendar', '<div id="calendarContainer"></div>', 'calendar');
        renderCalendar(win.querySelector('#calendarContainer'), currentYear, currentMonth);
        document.body.appendChild(win); win.style.zIndex = Date.now();
        win.style.zIndex = Date.now();
    }

    // --- CALCULATOR ---
    function openCalculator() {
        const calcId = 'calc_' + Date.now();
        const html = `<div><h3>🧮 Calculator</h3><div class="calculator"><div class="display" id="${calcId}_display">0</div>
        <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button><button data-op="/">/</button>
        <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button><button data-op="*">*</button>
        <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button><button data-op="-">-</button>
        <button data-val="0">0</button><button data-val=".">.</button><button data-op="=">=</button><button data-op="+">+</button>
        <button data-op="C">C</button></div></div>`;
        const win = createWindow('Calculator', html, 'calculator');
        document.body.appendChild(win); win.style.zIndex = Date.now();
        win.style.zIndex = Date.now();
        const display = win.querySelector(`#${calcId}_display`);
        let current = '0', prev = null, op = null;
        function updateDisplay() { display.innerText = current; }
        function compute() {
            if (prev !== null && op !== null) {
                let a = parseFloat(prev), b = parseFloat(current);
                if (op === '+') current = (a + b).toString();
                else if (op === '-') current = (a - b).toString();
                else if (op === '*') current = (a * b).toString();
                else if (op === '/') current = b !== 0 ? (a / b).toString() : 'Error';
                prev = null; op = null; updateDisplay();
            }
        }

        win.querySelectorAll('[data-op]').forEach(btn => { btn.onclick = () => { let operation = btn.getAttribute('data-op'); if (operation === 'C') { current = '0'; prev = null; op = null; updateDisplay(); } else if (operation === '=') { compute(); } else { if (prev !== null && op !== null) compute(); prev = current; op = operation; current = '0'; } }; });

    function initStore(win){
        // Remove padding for clean look
        const wc = win.querySelector('.window-content');
        if (wc) { wc.style.padding = '0'; wc.style.overflow = 'hidden'; }
        const container = win.querySelector('#storeItemsContainer');
        const sectionTitle = win.querySelector('#storeSectionTitle');

        // ── Category tab filtering ──────────────────────────────────────
        let activeCategory = 'All';
        function applyFilter() {
            const q = (win.querySelector('#storeSearch')?.value || '').toLowerCase();
            container && container.querySelectorAll('.ms11-app-card').forEach(card => {
                const cat  = card.getAttribute('data-category') || 'All';
                const name = card.querySelector('.ms11-app-name')?.textContent.toLowerCase() || '';
                const catOk  = activeCategory === 'All' || cat === activeCategory;
                const nameOk = !q || name.includes(q);
                card.style.display = (catOk && nameOk) ? '' : 'none';
            });
            if (sectionTitle) sectionTitle.textContent = activeCategory === 'All' ? 'All apps' : activeCategory;
        }

        const catBar = win.querySelector('#storeCats');
        if (catBar) catBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.ms11-cat');
            if (!btn) return;
            catBar.querySelectorAll('.ms11-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.getAttribute('data-cat');
            applyFilter();
        });

        if (container) container.addEventListener('click', (e) => {
            const btn = e.target.closest('.ms11-get-btn') || e.target.closest('.ms11-app-card');
            if (!btn) return;
            const id = btn.getAttribute('data-game');
            const def = storeGames.find(g => g.id === id);
            if (def) installGame(def);
        });
        // Search filter
        const search = win.querySelector('#storeSearch');
        if (search) search.addEventListener('input', applyFilter);
    }

                // Update slider fill

    // Opens any URL in a floating in-app browser window instead of navigating away
    function openInAppBrowser(url, title) {
        title = title || url.replace(/^https?:\/\//, '').split('/')[0];
        const winId = 'browser_' + Date.now();
        const html = `<div style="display:flex;flex-direction:column;height:100%;background:#1e2230;">
            <div style="background:rgba(0,0,0,0.35);padding:6px 8px;display:flex;align-items:center;gap:6px;">
                <button class="fx-nav-btn" id="brBack" title="Back" style="font-size:16px;padding:2px 8px;">&#8592;</button>
                <button class="fx-nav-btn" id="brFwd"  title="Forward" style="font-size:16px;padding:2px 8px;">&#8594;</button>
                <input id="brUrl" value="${escapeHtml(url)}" style="flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:5px;color:white;padding:4px 8px;font-size:13px;outline:none;" />
                <button class="fx-tb-btn" id="brGo">Go</button>
            </div>
            <iframe id="brFrame" src="${escapeHtml(url)}" style="flex:1;border:none;background:white;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
        </div>`;
        const win = createWindow('🌐 ' + title, html, winId);
        win.style.width  = '820px';
        win.style.height = '600px';
        document.body.appendChild(win);
        win.style.zIndex = Date.now();
        // Remove padding & light background so dark apps fill the window cleanly
        const wc = win.querySelector('.window-content');
        if (wc) { wc.style.padding = '0'; wc.style.background = '#1e2230'; wc.style.overflow = 'hidden'; }
        const frame  = win.querySelector('#brFrame');
        const urlBar = win.querySelector('#brUrl');
        const go = () => {
            let u = urlBar.value.trim();
            if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
            frame.src = u;
        };
        win.querySelector('#brGo').onclick = go;
        urlBar.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        win.querySelector('#brBack').onclick = () => { try { frame.contentWindow.history.back(); } catch(e){} };
        win.querySelector('#brFwd').onclick  = () => { try { frame.contentWindow.history.forward(); } catch(e){} };
        // Update URL bar when iframe navigates (same-origin only)
        frame.addEventListener('load', () => { try { urlBar.value = frame.contentWindow.location.href; } catch(e){} });
    }
